services:
  db:
    image: postgres:17
    container_name: dbcas-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  sandbox:
    build: ./sandbox
    container_name: dbcas-sandbox
    environment:
      POSTGRES_PASSWORD: ${SANDBOX_POSTGRES_PASSWORD}
      SANDBOX_LEARNER_PASSWORD: ${SANDBOX_LEARNER_PASSWORD:-learner_ro_dev}
      SANDBOX_STATEMENT_TIMEOUT_MS: ${SANDBOX_STATEMENT_TIMEOUT_MS:-3000}
    ports:
      - "${SANDBOX_PORT}:5432"
    mem_limit: 256m
    restart: unless-stopped

volumes:
  db-data:
