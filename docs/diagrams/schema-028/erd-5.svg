<svg xmlns="http://www.w3.org/2000/svg" width="950" height="1098" viewBox="0 0 950 1098" role="img" aria-label="Entity Relationship Diagram — DBCAS (5/15)">
<title>Entity Relationship Diagram — DBCAS (5/15)</title><desc>41 bảng thật, thuộc tính PK/FK/kiểu/null; legacy/retired = assessment, assessment_blueprint, assessment_concept, assessment_question</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34495e"/></marker><marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa7b4"/></marker></defs>
<rect width="950" height="1098" fill="#ffffff"/>
<text x="24" y="34" font-family="Arial" font-size="26" font-weight="bold" fill="#10254f">Entity Relationship Diagram — DBCAS (5/15)</text>
<text x="30" y="64" font-family="Arial" font-size="13" fill="#5c6c7c">PK = primary key · FK = foreign key · NULL = nullable · legacy/retired tables are shaded amber.</text>
<g id="table_document_chunk"><rect x="30" y="92" width="430" height="230" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="92" width="430" height="28" fill="#dceaf7"/><text x="38" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">document_chunk</text>
<text x="38" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">chunk_id: integer PK NOT NULL</text>
<text x="38" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">document_id: integer FK NOT NULL</text>
<text x="38" y="180" font-family="Consolas,monospace" font-size="15" fill="#26384a">ordinal: integer NOT NULL</text>
<text x="38" y="200" font-family="Consolas,monospace" font-size="15" fill="#26384a">page_from: integer NULL</text>
<text x="38" y="220" font-family="Consolas,monospace" font-size="15" fill="#26384a">page_to: integer NULL</text>
<text x="38" y="240" font-family="Consolas,monospace" font-size="15" fill="#26384a">heading: text NULL</text>
<text x="38" y="260" font-family="Consolas,monospace" font-size="15" fill="#26384a">text: text NOT NULL</text>
<text x="38" y="280" font-family="Consolas,monospace" font-size="15" fill="#26384a">text_hash: character varying(64) NOT NULL</text>
<text x="38" y="300" font-family="Consolas,monospace" font-size="15" fill="#26384a">char_count: integer NOT NULL</text>
</g>
<g id="table_document_clo"><rect x="490" y="92" width="430" height="150" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="92" width="430" height="28" fill="#dceaf7"/><text x="498" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">document_clo</text>
<text x="498" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">document_id: integer PK,FK NOT NULL</text>
<text x="498" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">clo_id: integer PK,FK NOT NULL</text>
<text x="498" y="180" font-family="Consolas,monospace" font-size="15" fill="#26384a">status: character varying(20) NOT NULL</text>
<text x="498" y="200" font-family="Consolas,monospace" font-size="15" fill="#26384a">approved_by: integer FK NULL</text>
<text x="498" y="220" font-family="Consolas,monospace" font-size="15" fill="#26384a">approved_at: timestamp with time zone NULL</text>
</g>
<g id="table_evaluation_record"><rect x="30" y="346" width="430" height="250" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="346" width="430" height="28" fill="#dceaf7"/><text x="38" y="365" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">evaluation_record</text>
<text x="38" y="394" font-family="Consolas,monospace" font-size="15" fill="#26384a">evaluation_id: integer PK NOT NULL</text>
