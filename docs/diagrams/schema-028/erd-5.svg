<text x="38" y="454" font-family="Consolas,monospace" font-size="15" fill="#26384a">scope_key: character varying(80) NOT NULL</text>
<text x="38" y="474" font-family="Consolas,monospace" font-size="15" fill="#26384a">input_hash: character varying(64) NOT NULL</text>
