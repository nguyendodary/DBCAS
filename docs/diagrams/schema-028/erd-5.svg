<text x="38" y="514" font-family="Consolas,monospace" font-size="15" fill="#26384a">payload: jsonb NULL</text>
<text x="38" y="534" font-family="Consolas,monospace" font-size="15" fill="#26384a">lease_until: timestamp with time zone NULL</text>
<text x="38" y="554" font-family="Consolas,monospace" font-size="15" fill="#26384a">updated_at: timestamp with time zone NOT NULL</text>
<text x="38" y="574" font-family="Consolas,monospace" font-size="15" fill="#26384a">available_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_grade_edit_audit"><rect x="490" y="346" width="430" height="190" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="346" width="430" height="28" fill="#dceaf7"/><text x="498" y="365" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">grade_edit_audit</text>
<text x="498" y="394" font-family="Consolas,monospace" font-size="15" fill="#26384a">audit_id: integer PK NOT NULL</text>
<text x="498" y="414" font-family="Consolas,monospace" font-size="15" fill="#26384a">attempt_id: integer FK NOT NULL</text>
<text x="498" y="434" font-family="Consolas,monospace" font-size="15" fill="#26384a">reviewer_id: integer FK NOT NULL</text>
<text x="498" y="454" font-family="Consolas,monospace" font-size="15" fill="#26384a">old_score: numeric NULL</text>
<text x="498" y="474" font-family="Consolas,monospace" font-size="15" fill="#26384a">new_score: numeric NOT NULL</text>
<text x="498" y="494" font-family="Consolas,monospace" font-size="15" fill="#26384a">reason: character varying(1000) NOT NULL</text>
<text x="498" y="514" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_grade_review"><rect x="30" y="620" width="430" height="210" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="620" width="430" height="28" fill="#dceaf7"/><text x="38" y="639" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">grade_review</text>
<text x="38" y="668" font-family="Consolas,monospace" font-size="15" fill="#26384a">review_id: integer PK NOT NULL</text>
<text x="38" y="688" font-family="Consolas,monospace" font-size="15" fill="#26384a">attempt_id: integer FK NOT NULL</text>
<text x="38" y="708" font-family="Consolas,monospace" font-size="15" fill="#26384a">reviewer_id: integer FK NOT NULL</text>
<text x="38" y="728" font-family="Consolas,monospace" font-size="15" fill="#26384a">automated_score: numeric NULL</text>
<text x="38" y="748" font-family="Consolas,monospace" font-size="15" fill="#26384a">automated_detail: jsonb NULL</text>
<text x="38" y="768" font-family="Consolas,monospace" font-size="15" fill="#26384a">approved_score: numeric NOT NULL</text>
<text x="38" y="788" font-family="Consolas,monospace" font-size="15" fill="#26384a">comments: text NULL</text>
<text x="38" y="808" font-family="Consolas,monospace" font-size="15" fill="#26384a">reviewed_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_grading_job"><rect x="490" y="620" width="430" height="210" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="620" width="430" height="28" fill="#dceaf7"/><text x="498" y="639" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">grading_job</text>
<text x="498" y="668" font-family="Consolas,monospace" font-size="15" fill="#26384a">job_id: integer PK NOT NULL</text>
<text x="498" y="688" font-family="Consolas,monospace" font-size="15" fill="#26384a">attempt_id: integer FK NOT NULL</text>
<text x="498" y="708" font-family="Consolas,monospace" font-size="15" fill="#26384a">status: character varying(20) NOT NULL</text>
<text x="498" y="728" font-family="Consolas,monospace" font-size="15" fill="#26384a">attempt_count: integer NOT NULL</text>
<text x="498" y="748" font-family="Consolas,monospace" font-size="15" fill="#26384a">available_at: timestamp with time zone NOT NULL</text>
<text x="498" y="768" font-family="Consolas,monospace" font-size="15" fill="#26384a">lease_until: timestamp with time zone NULL</text>
<text x="498" y="788" font-family="Consolas,monospace" font-size="15" fill="#26384a">last_error_code: character varying(80) NULL</text>
<text x="498" y="808" font-family="Consolas,monospace" font-size="15" fill="#26384a">finished_at: timestamp with time zone NULL</text>
</g>
<g id="table_llm_cache"><rect x="30" y="854" width="430" height="190" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="854" width="430" height="28" fill="#dceaf7"/><text x="38" y="873" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">llm_cache</text>
<text x="38" y="902" font-family="Consolas,monospace" font-size="15" fill="#26384a">cache_id: integer PK NOT NULL</text>
