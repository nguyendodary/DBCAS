<text x="498" y="648" font-family="Consolas,monospace" font-size="15" fill="#26384a">status: character varying(20) NOT NULL</text>
<text x="498" y="668" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_by: integer FK NOT NULL</text>
<text x="498" y="688" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
<text x="498" y="708" font-family="Consolas,monospace" font-size="15" fill="#26384a">updated_at: timestamp with time zone NOT NULL</text>
<text x="498" y="728" font-family="Consolas,monospace" font-size="15" fill="#26384a">ai_review: jsonb NULL</text>
<text x="498" y="748" font-family="Consolas,monospace" font-size="15" fill="#26384a">family_id: integer FK NULL</text>
<text x="498" y="768" font-family="Consolas,monospace" font-size="15" fill="#26384a">version_no: integer NOT NULL</text>
<text x="498" y="788" font-family="Consolas,monospace" font-size="15" fill="#26384a">explanation: text NULL</text>
<text x="498" y="808" font-family="Consolas,monospace" font-size="15" fill="#26384a">tags: ARRAY NOT NULL</text>
<text x="498" y="828" font-family="Consolas,monospace" font-size="15" fill="#26384a">source_refs: jsonb NOT NULL</text>
<text x="498" y="848" font-family="Consolas,monospace" font-size="15" fill="#26384a">original_locale: character varying(16) NOT NULL</text>
</g>
<g id="table_question_candidate"><rect x="30" y="894" width="430" height="210" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="894" width="430" height="28" fill="#dceaf7"/><text x="38" y="913" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">question_candidate</text>
