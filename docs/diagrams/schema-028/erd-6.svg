<text x="498" y="568" font-family="Consolas,monospace" font-size="15" fill="#26384a">reference_answer: text NULL</text>
<text x="498" y="588" font-family="Consolas,monospace" font-size="15" fill="#26384a">difficulty_level: smallint NOT NULL</text>
<text x="498" y="608" font-family="Consolas,monospace" font-size="15" fill="#26384a">points: numeric NOT NULL</text>
