<text x="38" y="548" font-family="Consolas,monospace" font-size="15" fill="#26384a">actor_id: integer FK NOT NULL</text>
<text x="38" y="568" font-family="Consolas,monospace" font-size="15" fill="#26384a">result: character varying(20) NOT NULL</text>
<text x="38" y="588" font-family="Consolas,monospace" font-size="15" fill="#26384a">accessed_at: timestamp with time zone NOT NULL</text>
<text x="38" y="608" font-family="Consolas,monospace" font-size="15" fill="#26384a">request_id: uuid NULL</text>
</g>
<g id="table_question"><rect x="490" y="460" width="430" height="410" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="460" width="430" height="28" fill="#dceaf7"/><text x="498" y="479" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">question</text>
