<svg xmlns="http://www.w3.org/2000/svg" width="950" height="964" viewBox="0 0 950 964" role="img" aria-label="Entity Relationship Diagram — DBCAS (4/15)">
<title>Entity Relationship Diagram — DBCAS (4/15)</title><desc>41 bảng thật, thuộc tính PK/FK/kiểu/null; legacy/retired = assessment, assessment_blueprint, assessment_concept, assessment_question</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34495e"/></marker><marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa7b4"/></marker></defs>
<rect width="950" height="964" fill="#ffffff"/>
<text x="24" y="34" font-family="Arial" font-size="26" font-weight="bold" fill="#10254f">Entity Relationship Diagram — DBCAS (4/15)</text>
<text x="30" y="64" font-family="Arial" font-size="13" fill="#5c6c7c">PK = primary key · FK = foreign key · NULL = nullable · legacy/retired tables are shaded amber.</text>
<g id="table_competency_gap"><rect x="30" y="92" width="430" height="190" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="92" width="430" height="28" fill="#dceaf7"/><text x="38" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">competency_gap</text>
<text x="38" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">gap_id: integer PK NOT NULL</text>
<text x="38" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="38" y="180" font-family="Consolas,monospace" font-size="15" fill="#26384a">concept_id: integer FK NOT NULL</text>
<text x="38" y="200" font-family="Consolas,monospace" font-size="15" fill="#26384a">llm_explanation: text NULL</text>
<text x="38" y="220" font-family="Consolas,monospace" font-size="15" fill="#26384a">status: character varying(20) NOT NULL</text>
<text x="38" y="240" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
<text x="38" y="260" font-family="Consolas,monospace" font-size="15" fill="#26384a">explanation_context_hash: character varying(64) NULL</text>
</g>
<g id="table_concept"><rect x="490" y="92" width="430" height="230" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="92" width="430" height="28" fill="#dceaf7"/><text x="498" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">concept</text>
<text x="498" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">concept_id: integer PK NOT NULL</text>
<text x="498" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">concept_code: character varying(30) NOT NULL</text>
<text x="498" y="180" font-family="Consolas,monospace" font-size="15" fill="#26384a">concept_name: character varying(100) NOT NULL</text>
<text x="498" y="200" font-family="Consolas,monospace" font-size="15" fill="#26384a">subject_area: character varying(100) NOT NULL</text>
<text x="498" y="220" font-family="Consolas,monospace" font-size="15" fill="#26384a">description: text NULL</text>
<text x="498" y="240" font-family="Consolas,monospace" font-size="15" fill="#26384a">difficulty_level: smallint NOT NULL</text>
<text x="498" y="260" font-family="Consolas,monospace" font-size="15" fill="#26384a">sql_feature: character varying(30) NULL</text>
<text x="498" y="280" font-family="Consolas,monospace" font-size="15" fill="#26384a">keywords: ARRAY NOT NULL</text>
<text x="498" y="300" font-family="Consolas,monospace" font-size="15" fill="#26384a">learning_objectives: ARRAY NOT NULL</text>
</g>
<g id="table_concept_competency"><rect x="30" y="346" width="430" height="210" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="346" width="430" height="28" fill="#dceaf7"/><text x="38" y="365" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">concept_competency</text>
<text x="38" y="394" font-family="Consolas,monospace" font-size="15" fill="#26384a">competency_id: integer PK NOT NULL</text>
<text x="38" y="414" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="38" y="434" font-family="Consolas,monospace" font-size="15" fill="#26384a">concept_id: integer FK NOT NULL</text>
<text x="38" y="454" font-family="Consolas,monospace" font-size="15" fill="#26384a">points_earned: numeric NOT NULL</text>
<text x="38" y="474" font-family="Consolas,monospace" font-size="15" fill="#26384a">points_possible: numeric NOT NULL</text>
<text x="38" y="494" font-family="Consolas,monospace" font-size="15" fill="#26384a">competency_pct: numeric NOT NULL</text>
<text x="38" y="514" font-family="Consolas,monospace" font-size="15" fill="#26384a">below_target: boolean NOT NULL</text>
<text x="38" y="534" font-family="Consolas,monospace" font-size="15" fill="#26384a">computed_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_concept_dependency"><rect x="490" y="346" width="430" height="110" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="346" width="430" height="28" fill="#dceaf7"/><text x="498" y="365" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">concept_dependency</text>
<text x="498" y="394" font-family="Consolas,monospace" font-size="15" fill="#26384a">concept_id: integer PK,FK NOT NULL</text>
<text x="498" y="414" font-family="Consolas,monospace" font-size="15" fill="#26384a">prerequisite_concept_id: integer PK,FK NOT NULL</text>
<text x="498" y="434" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_course_document"><rect x="30" y="580" width="430" height="330" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="580" width="430" height="28" fill="#dceaf7"/><text x="38" y="599" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">course_document</text>
<text x="38" y="628" font-family="Consolas,monospace" font-size="15" fill="#26384a">document_id: integer PK NOT NULL</text>
<text x="38" y="648" font-family="Consolas,monospace" font-size="15" fill="#26384a">title: character varying(300) NOT NULL</text>
<text x="38" y="668" font-family="Consolas,monospace" font-size="15" fill="#26384a">source_type: character varying(20) NOT NULL</text>
<text x="38" y="688" font-family="Consolas,monospace" font-size="15" fill="#26384a">mime_type: character varying(100) NOT NULL</text>
<text x="38" y="708" font-family="Consolas,monospace" font-size="15" fill="#26384a">original_filename: character varying(255) NULL</text>
<text x="38" y="728" font-family="Consolas,monospace" font-size="15" fill="#26384a">sha256: character varying(64) NOT NULL</text>
<text x="38" y="748" font-family="Consolas,monospace" font-size="15" fill="#26384a">char_count: integer NOT NULL</text>
<text x="38" y="768" font-family="Consolas,monospace" font-size="15" fill="#26384a">page_count: integer NULL</text>
<text x="38" y="788" font-family="Consolas,monospace" font-size="15" fill="#26384a">status: character varying(20) NOT NULL</text>
<text x="38" y="808" font-family="Consolas,monospace" font-size="15" fill="#26384a">uploaded_by: integer FK NOT NULL</text>
<text x="38" y="828" font-family="Consolas,monospace" font-size="15" fill="#26384a">uploaded_at: timestamp with time zone NOT NULL</text>
<text x="38" y="848" font-family="Consolas,monospace" font-size="15" fill="#26384a">approved_by: integer FK NULL</text>
<text x="38" y="868" font-family="Consolas,monospace" font-size="15" fill="#26384a">approved_at: timestamp with time zone NULL</text>
<text x="38" y="888" font-family="Consolas,monospace" font-size="15" fill="#26384a">text_policy_version: character varying(20) NOT NULL</text>
</g>
<g id="table_course_learning_outcome"><rect x="490" y="580" width="430" height="190" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="580" width="430" height="28" fill="#dceaf7"/><text x="498" y="599" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">course_learning_outcome</text>
<text x="498" y="628" font-family="Consolas,monospace" font-size="15" fill="#26384a">clo_id: integer PK NOT NULL</text>
<text x="498" y="648" font-family="Consolas,monospace" font-size="15" fill="#26384a">clo_code: character varying(20) NOT NULL</text>
<text x="498" y="668" font-family="Consolas,monospace" font-size="15" fill="#26384a">title: character varying(200) NOT NULL</text>
<text x="498" y="688" font-family="Consolas,monospace" font-size="15" fill="#26384a">description: text NULL</text>
<text x="498" y="708" font-family="Consolas,monospace" font-size="15" fill="#26384a">status: character varying(20) NOT NULL</text>
<text x="498" y="728" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_by: integer FK NOT NULL</text>
<text x="498" y="748" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
</svg>
