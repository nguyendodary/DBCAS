<svg xmlns="http://www.w3.org/2000/svg" width="950" height="1158" viewBox="0 0 950 1158" role="img" aria-label="Entity Relationship Diagram — DBCAS (7/15)">
<title>Entity Relationship Diagram — DBCAS (7/15)</title><desc>41 bảng thật, thuộc tính PK/FK/kiểu/null; legacy/retired = assessment, assessment_blueprint, assessment_concept, assessment_question</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34495e"/></marker><marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa7b4"/></marker></defs>
<rect width="950" height="1158" fill="#ffffff"/>
<text x="24" y="34" font-family="Arial" font-size="26" font-weight="bold" fill="#10254f">Entity Relationship Diagram — DBCAS (7/15)</text>
<text x="30" y="64" font-family="Arial" font-size="13" fill="#5c6c7c">PK = primary key · FK = foreign key · NULL = nullable · legacy/retired tables are shaded amber.</text>
<g id="table_question_concept"><rect x="30" y="92" width="430" height="170" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="92" width="430" height="28" fill="#dceaf7"/><text x="38" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">question_concept</text>
<text x="38" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">question_id: integer PK,FK NOT NULL</text>
<text x="38" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">concept_id: integer PK,FK NOT NULL</text>
<text x="38" y="180" font-family="Consolas,monospace" font-size="15" fill="#26384a">tag_source: character varying(10) NOT NULL</text>
<text x="38" y="200" font-family="Consolas,monospace" font-size="15" fill="#26384a">is_required: boolean NOT NULL</text>
<text x="38" y="220" font-family="Consolas,monospace" font-size="15" fill="#26384a">confirmed: boolean NOT NULL</text>
<text x="38" y="240" font-family="Consolas,monospace" font-size="15" fill="#26384a">review_status: character varying(20) NOT NULL</text>
</g>
<g id="table_question_evidence"><rect x="490" y="92" width="430" height="210" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="92" width="430" height="28" fill="#dceaf7"/><text x="498" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">question_evidence</text>
<text x="498" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">evidence_id: integer PK NOT NULL</text>
<text x="498" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">question_id: integer FK NOT NULL</text>
<text x="498" y="180" font-family="Consolas,monospace" font-size="15" fill="#26384a">chunk_id: integer FK NOT NULL</text>
<text x="498" y="200" font-family="Consolas,monospace" font-size="15" fill="#26384a">quote: text NOT NULL</text>
<text x="498" y="220" font-family="Consolas,monospace" font-size="15" fill="#26384a">start_offset: integer NULL</text>
<text x="498" y="240" font-family="Consolas,monospace" font-size="15" fill="#26384a">end_offset: integer NULL</text>
<text x="498" y="260" font-family="Consolas,monospace" font-size="15" fill="#26384a">source_hash: character varying(64) NOT NULL</text>
<text x="498" y="280" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_question_report"><rect x="30" y="326" width="430" height="310" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="326" width="430" height="28" fill="#dceaf7"/><text x="38" y="345" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">question_report</text>
<text x="38" y="374" font-family="Consolas,monospace" font-size="15" fill="#26384a">question_report_id: bigint PK NOT NULL</text>
<text x="38" y="394" font-family="Consolas,monospace" font-size="15" fill="#26384a">review_request_id: bigint FK NULL</text>
<text x="38" y="414" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="38" y="434" font-family="Consolas,monospace" font-size="15" fill="#26384a">attempt_id: integer FK NOT NULL</text>
<text x="38" y="454" font-family="Consolas,monospace" font-size="15" fill="#26384a">question_id: integer FK NOT NULL</text>
<text x="38" y="474" font-family="Consolas,monospace" font-size="15" fill="#26384a">reported_by: integer FK NOT NULL</text>
<text x="38" y="494" font-family="Consolas,monospace" font-size="15" fill="#26384a">category: character varying(20) NOT NULL</text>
<text x="38" y="514" font-family="Consolas,monospace" font-size="15" fill="#26384a">details: character varying(2000) NOT NULL</text>
<text x="38" y="534" font-family="Consolas,monospace" font-size="15" fill="#26384a">status: character varying(10) NOT NULL</text>
<text x="38" y="554" font-family="Consolas,monospace" font-size="15" fill="#26384a">resolution_note: character varying(2000) NULL</text>
<text x="38" y="574" font-family="Consolas,monospace" font-size="15" fill="#26384a">resolved_by: integer FK NULL</text>
<text x="38" y="594" font-family="Consolas,monospace" font-size="15" fill="#26384a">resolved_at: timestamp with time zone NULL</text>
<text x="38" y="614" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_question_rubric_criterion"><rect x="490" y="326" width="430" height="230" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="326" width="430" height="28" fill="#dceaf7"/><text x="498" y="345" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">question_rubric_criterion</text>
<text x="498" y="374" font-family="Consolas,monospace" font-size="15" fill="#26384a">criterion_id: bigint PK NOT NULL</text>
<text x="498" y="394" font-family="Consolas,monospace" font-size="15" fill="#26384a">rubric_profile_id: bigint FK NOT NULL</text>
<text x="498" y="414" font-family="Consolas,monospace" font-size="15" fill="#26384a">criterion_code: character varying(40) NOT NULL</text>
<text x="498" y="434" font-family="Consolas,monospace" font-size="15" fill="#26384a">criterion_name: character varying(120) NOT NULL</text>
<text x="498" y="454" font-family="Consolas,monospace" font-size="15" fill="#26384a">description: text NOT NULL</text>
<text x="498" y="474" font-family="Consolas,monospace" font-size="15" fill="#26384a">scoring_guidance: text NOT NULL</text>
<text x="498" y="494" font-family="Consolas,monospace" font-size="15" fill="#26384a">max_points: numeric NOT NULL</text>
<text x="498" y="514" font-family="Consolas,monospace" font-size="15" fill="#26384a">sort_order: smallint NOT NULL</text>
<text x="498" y="534" font-family="Consolas,monospace" font-size="15" fill="#26384a">criterion_hash: character(64) NOT NULL</text>
</g>
<g id="table_question_rubric_profile"><rect x="30" y="660" width="430" height="210" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="660" width="430" height="28" fill="#dceaf7"/><text x="38" y="679" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">question_rubric_profile</text>
<text x="38" y="708" font-family="Consolas,monospace" font-size="15" fill="#26384a">rubric_profile_id: bigint PK NOT NULL</text>
<text x="38" y="728" font-family="Consolas,monospace" font-size="15" fill="#26384a">question_id: integer FK NOT NULL</text>
<text x="38" y="748" font-family="Consolas,monospace" font-size="15" fill="#26384a">version_no: integer NOT NULL</text>
<text x="38" y="768" font-family="Consolas,monospace" font-size="15" fill="#26384a">status: character varying(10) NOT NULL</text>
<text x="38" y="788" font-family="Consolas,monospace" font-size="15" fill="#26384a">profile_hash: character(64) NOT NULL</text>
<text x="38" y="808" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_by: integer FK NOT NULL</text>
<text x="38" y="828" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
<text x="38" y="848" font-family="Consolas,monospace" font-size="15" fill="#26384a">retired_at: timestamp with time zone NULL</text>
</g>
<g id="table_question_translation"><rect x="490" y="660" width="430" height="210" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="660" width="430" height="28" fill="#dceaf7"/><text x="498" y="679" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">question_translation</text>
<text x="498" y="708" font-family="Consolas,monospace" font-size="15" fill="#26384a">question_id: integer PK,FK NOT NULL</text>
<text x="498" y="728" font-family="Consolas,monospace" font-size="15" fill="#26384a">locale: character varying(16) PK NOT NULL</text>
<text x="498" y="748" font-family="Consolas,monospace" font-size="15" fill="#26384a">source_hash: character varying(64) NOT NULL</text>
<text x="498" y="768" font-family="Consolas,monospace" font-size="15" fill="#26384a">prompt: text NOT NULL</text>
<text x="498" y="788" font-family="Consolas,monospace" font-size="15" fill="#26384a">explanation: text NULL</text>
<text x="498" y="808" font-family="Consolas,monospace" font-size="15" fill="#26384a">option_texts: jsonb NOT NULL</text>
<text x="498" y="828" font-family="Consolas,monospace" font-size="15" fill="#26384a">rubrics: jsonb NOT NULL</text>
<text x="498" y="848" font-family="Consolas,monospace" font-size="15" fill="#26384a">updated_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_refresh_session"><rect x="30" y="894" width="430" height="210" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="894" width="430" height="28" fill="#dceaf7"/><text x="38" y="913" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">refresh_session</text>
