<text x="38" y="982" font-family="Consolas,monospace" font-size="15" fill="#26384a">account_id: integer FK NOT NULL</text>
<text x="38" y="1002" font-family="Consolas,monospace" font-size="15" fill="#26384a">credential_version: bigint NOT NULL</text>
<text x="38" y="1022" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
<text x="38" y="1042" font-family="Consolas,monospace" font-size="15" fill="#26384a">expires_at: timestamp with time zone NOT NULL</text>
<text x="38" y="1062" font-family="Consolas,monospace" font-size="15" fill="#26384a">consumed_at: timestamp with time zone NULL</text>
<text x="38" y="1082" font-family="Consolas,monospace" font-size="15" fill="#26384a">revoked_at: timestamp with time zone NULL</text>
</g>
<g id="table_result_release_event"><rect x="490" y="894" width="430" height="170" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="894" width="430" height="28" fill="#dceaf7"/><text x="498" y="913" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">result_release_event</text>
<text x="498" y="942" font-family="Consolas,monospace" font-size="15" fill="#26384a">event_id: integer PK NOT NULL</text>
<text x="498" y="962" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="498" y="982" font-family="Consolas,monospace" font-size="15" fill="#26384a">previous_status: character varying(20) NOT NULL</text>
<text x="498" y="1002" font-family="Consolas,monospace" font-size="15" fill="#26384a">new_status: character varying(20) NOT NULL</text>
<text x="498" y="1022" font-family="Consolas,monospace" font-size="15" fill="#26384a">reviewer_id: integer FK NULL</text>
<text x="498" y="1042" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
</svg>
