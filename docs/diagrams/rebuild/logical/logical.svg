<text x="1246.5" y="1548.0" font-size="34" font-weight="normal" fill="#111111">Bank + AI selection · Validate · Freeze (FR-15)</text>
<text x="740.5" y="2162.0" font-size="34" font-weight="normal" fill="#111111">41 tables: Users &amp; Roles | CLOs &amp; Concept Model | Question Bank &amp; Rubrics | Practice Sessions &amp; Frozen Plans |</text>
<text x="738.5" y="2210.0" font-size="34" font-weight="normal" fill="#111111">Attempts &amp; Evidence | Grading/Release Audit | Cached LLM Responses — short-lived JWT + refresh-session table</text>
