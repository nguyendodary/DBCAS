<text x="1980" y="1976" font-size="34" font-weight="normal" letter-spacing="0.04" fill="#111111">Evidence &amp; Cached LLM Writes</text>
<text x="740" y="2634" font-size="34" font-weight="normal" fill="#111111">SQL Exec &amp; Output Match</text>
<text x="2034" y="2634" font-size="34" font-weight="normal" letter-spacing="0.05" fill="#111111">Prompts &amp; Structured JSON</text>
<text x="815" y="364" font-size="45" font-weight="bold" letter-spacing="0.55" fill="#111111">TIER 1: PRESENTATION TIER (REACT.JS / VITE / TAILWIND / CHART.JS)</text>
<text x="1826" y="584" font-size="46" font-weight="bold" fill="#111111">Administrator Management Portal</text>
<text x="924" y="978" font-size="45" font-weight="bold" letter-spacing="0.56" fill="#111111">TIER 2: APPLICATION &amp; SERVICES TIER (FASTAPI / PYTHON)</text>
<text x="309" y="1180" font-size="46" font-weight="bold" letter-spacing="0.05" fill="#111111">Auth &amp; Role Management</text>
<text x="1394" y="1180" font-size="46" font-weight="bold" fill="#111111">Request Validation</text>
<text x="304" y="1236" font-size="34" font-weight="normal" fill="#111111">JWT Auth · RBAC · Stateless (FR-01)</text>
<text x="1344" y="1236" font-size="34" font-weight="normal" letter-spacing="0.03" fill="#111111">Pydantic Schemas · Rate Limiting</text>
<text x="290" y="1492" font-size="46" font-weight="bold" fill="#111111">Automated Grading Engine</text>
<text x="2316" y="1492" font-size="46" font-weight="bold" letter-spacing="0.05" fill="#111111">Competency &amp; Gap Engine</text>
<text x="218" y="1548" font-size="34" font-weight="normal" letter-spacing="0.02" fill="#111111">MCQ · SQL Output · Essay Rubric (FR-08/09/10)</text>
<text x="2266" y="1548" font-size="34" font-weight="normal" letter-spacing="0.02" fill="#111111">Evidence · Competency · Gaps (FR-11/12/14)</text>
<text x="1071" y="1862" font-size="45" font-weight="bold" letter-spacing="0.59" fill="#111111">TIER 3: DATA &amp; STORAGE TIER (POSTGRESQL)</text>
<text x="1467" y="2112" font-size="46" font-weight="bold" fill="#111111">PostgreSQL</text>
<text x="970" y="2472" font-size="46" font-weight="bold" letter-spacing="0.02" fill="#111111">TIER 4: EXTERNAL AI SERVICE &amp; EXECUTION SANDBOX</text>
<text x="605" y="2792" font-size="46" font-weight="bold" letter-spacing="0.06" fill="#111111">Docker SQL Sandbox</text>
<text x="2004" y="2792" font-size="46" font-weight="bold" letter-spacing="0.03" fill="#111111">LLM Provider API (Any Provider)</text>
<text x="501" y="2848" font-size="34" font-weight="normal" fill="#111111">Isolated PostgreSQL · Read-Only Tx (FR-09)</text>
<text x="1908" y="2848" font-size="34" font-weight="normal" letter-spacing="0.02" fill="#111111">Essay Scoring · CLO Mapping · Explanations (FR-10/03/14)</text>
<text x="750.5" y="584.0" font-size="46" font-weight="bold" fill="#111111">Learner Practice Portal</text>
<text x="641.5" y="640.0" font-size="34" font-weight="normal" fill="#111111">Practice setup · Competency charts · SQL editor</text>
<text x="1674.4" y="640.0" font-size="34" font-weight="normal" letter-spacing="-0.64" fill="#111111">CLOs &amp; Concepts (FR-02) · Question Bank (FR-04) · Analytics &amp; review</text>
<text x="2335.5" y="1180.0" font-size="46" font-weight="bold" fill="#111111">Practice Session Service</text>
<text x="2241.0" y="1236.0" font-size="34" font-weight="normal" fill="#111111">Plan assembly · Frozen delivery · 30-min session</text>
