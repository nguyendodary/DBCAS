<text x="669" y="176" font-size="42" font-weight="normal" letter-spacing="0.06" fill="#111111">Four-Tier Architecture: Presentation, Application &amp; Services, Data &amp; Storage, External AI &amp; Sandbox</text>
<text x="228" y="768" font-size="36" font-weight="normal" fill="#111111">Learner</text>
