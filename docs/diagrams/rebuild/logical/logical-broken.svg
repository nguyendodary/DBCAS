<g font-family="Arial, Helvetica, sans-serif">
<text x="150" y="120" font-size="78" font-weight="bold" fill="#111111">DBCAS Logical System Architecture Diagram</text>
<text x="210" y="126" font-size="42" font-weight="normal" fill="#111111">Four-Tier Architecture: Presentation, Application &amp; Services, Data &amp; Storage, External AI &amp; Sandbox</text>
<text x="270" y="132" font-size="36" font-weight="normal" fill="#111111">Learner</text>
<text x="150" y="138" font-size="36" font-weight="normal" fill="#111111">Administrator</text>
<text x="210" y="144" font-size="34" font-weight="normal" fill="#111111">HTTPS / REST</text>
<text x="270" y="150" font-size="34" font-weight="normal" fill="#111111">HTTPS / REST</text>
<text x="150" y="156" font-size="34" font-weight="normal" fill="#111111">SQL / SQLAlchemy ORM</text>
<text x="210" y="162" font-size="34" font-weight="normal" fill="#111111">Evidence &amp; Cached LLM Writes</text>
<text x="270" y="168" font-size="34" font-weight="normal" fill="#111111">SQL Exec &amp; Output Match</text>
<text x="150" y="174" font-size="34" font-weight="normal" fill="#111111">Prompts &amp; Structured JSON</text>
<text x="210" y="180" font-size="45" font-weight="bold" fill="#111111">TIER 1: PRESENTATION TIER (REACT.JS / VITE / TAILWIND / CHART.JS)</text>
<text x="270" y="186" font-size="46" font-weight="bold" fill="#111111">Learner Assessment Portal</text>
<text x="150" y="192" font-size="46" font-weight="bold" fill="#111111">Administrator Management Portal</text>
<text x="210" y="198" font-size="34" font-weight="normal" fill="#111111">Exam UI · Competency Charts (FR-07/13) · SQL Editor</text>
<text x="270" y="204" font-size="34" font-weight="normal" fill="#111111">CLOs &amp; Concepts (FR-02) · Question Bank (FR-04) · Analytics</text>
<text x="150" y="210" font-size="45" font-weight="bold" fill="#111111">TIER 2: APPLICATION &amp; SERVICES TIER (FASTAPI / PYTHON)</text>
<text x="210" y="216" font-size="46" font-weight="bold" fill="#111111">Assessment Session Service</text>
<text x="270" y="222" font-size="46" font-weight="bold" fill="#111111">Auth &amp; Role Management</text>
<text x="150" y="228" font-size="46" font-weight="bold" fill="#111111">Request Validation</text>
<text x="210" y="234" font-size="34" font-weight="normal" fill="#111111">JWT Auth · RBAC · Stateless (FR-01)</text>
<text x="270" y="240" font-size="34" font-weight="normal" fill="#111111">Pydantic Schemas · Rate Limiting</text>
<text x="150" y="246" font-size="34" font-weight="normal" fill="#111111">Session Coordination · Question Delivery</text>
<text x="210" y="252" font-size="46" font-weight="bold" fill="#111111">Automated Grading Engine</text>
<text x="270" y="258" font-size="46" font-weight="bold" fill="#111111">Competency &amp; Gap Engine</text>
<text x="150" y="264" font-size="46" font-weight="bold" fill="#111111">Adaptive Engine</text>
<text x="210" y="270" font-size="34" font-weight="normal" fill="#111111">MCQ · SQL Output · Essay Rubric (FR-08/09/10)</text>
<text x="270" y="276" font-size="34" font-weight="normal" fill="#111111">Concept + Difficulty + Type · Gen/Validate (FR-15)</text>
<text x="150" y="282" font-size="34" font-weight="normal" fill="#111111">Evidence · Competency · Gaps (FR-11/12/14)</text>
<text x="210" y="288" font-size="45" font-weight="bold" fill="#111111">TIER 3: DATA &amp; STORAGE TIER (POSTGRESQL)</text>
<text x="270" y="294" font-size="46" font-weight="bold" fill="#111111">PostgreSQL</text>
<text x="150" y="300" font-size="34" font-weight="normal" fill="#111111">Users &amp; Roles | CLOs &amp; Concept Model | Question Bank &amp; Rubrics | Attempts</text>
<text x="210" y="306" font-size="34" font-weight="normal" fill="#111111">Evidence Logs | Cached LLM Responses — Stateless JWT (no session store)</text>
<text x="270" y="312" font-size="46" font-weight="bold" fill="#111111">TIER 4: EXTERNAL AI SERVICE &amp; EXECUTION SANDBOX</text>
<text x="150" y="318" font-size="46" font-weight="bold" fill="#111111">Docker SQL Sandbox</text>
<text x="210" y="324" font-size="46" font-weight="bold" fill="#111111">LLM Provider API (Any Provider)</text>
<text x="270" y="330" font-size="34" font-weight="normal" fill="#111111">Isolated PostgreSQL · Read-Only Tx (FR-09)</text>
<text x="150" y="336" font-size="34" font-weight="normal" fill="#111111">Essay Scoring · CLO Mapping · Explanations (FR-10/03/14)</text>
</g>
