<g font-family="Arial, Helvetica, sans-serif">
<text x="1010" y="103" font-size="78" font-weight="bold" letter-spacing="-0.24" fill="#1A4D79">DBCAS Use Case Diagram</text>
<text x="1324" y="290" font-size="48" font-weight="bold" letter-spacing="0.27" fill="#202B35">DBCAS system</text>
<text x="82" y="1891" font-size="41" font-weight="normal" letter-spacing="0.67" fill="#202B35">Learner</text>
<text x="2717" y="1917" font-size="44" font-weight="normal" letter-spacing="-0.17" fill="#202B35">Administrator</text>
<text x="814" y="2981" font-size="37" font-weight="normal" letter-spacing="0.12" fill="#5F6D77">Learner registration is available before sign-in. UC13 and UC14 occur within UC12.</text>
<text x="1381" y="493" font-size="43" font-weight="bold" fill="#202B35">UC02 Login</text>
<text x="1367" y="713" font-size="43" font-weight="bold" letter-spacing="-0.20" fill="#202B35">UC03 Logout</text>
<text x="682" y="1001" font-size="36" font-weight="normal" letter-spacing="0.04" fill="#202B35">UC01 Register learner account</text>
<text x="1758" y="1001" font-size="36" font-weight="normal" letter-spacing="0.03" fill="#202B35">UC04 Provision administrator accounts</text>
<text x="615" y="1246" font-size="36" font-weight="normal" letter-spacing="0.15" fill="#202B35">UC12 Take timed adaptive assessment</text>
<text x="1758" y="1246" font-size="36" font-weight="normal" letter-spacing="0.03" fill="#202B35">UC05 Define CLOs and concept model</text>
<text x="729" y="1491" font-size="36" font-weight="normal" letter-spacing="0.10" fill="#202B35">UC13 Write and run SQL</text>
<text x="1723" y="1491" font-size="36" font-weight="normal" letter-spacing="0.08" fill="#202B35">UC06 Review AI-suggested CLO mappings</text>
<text x="602" y="1736" font-size="36" font-weight="normal" letter-spacing="0.09" fill="#202B35">UC14 Answer MCQ and essay questions</text>
<text x="1770" y="1736" font-size="36" font-weight="normal" letter-spacing="0.03" fill="#202B35">UC07 Curate validated question bank</text>
<text x="1743" y="1959" font-size="36" font-weight="normal" letter-spacing="0.09" fill="#202B35">UC08 Review AI-recommended question</text>
<text x="577" y="1981" font-size="36" font-weight="normal" letter-spacing="0.03" fill="#202B35">UC15 Receive grading results and feedback</text>
<text x="2035" y="2003" font-size="36" font-weight="normal" letter-spacing="0.33" fill="#202B35">tags</text>
<text x="683" y="2226" font-size="36" font-weight="normal" letter-spacing="0.07" fill="#202B35">UC16 View competency profile</text>
<text x="1757" y="2226" font-size="36" font-weight="normal" letter-spacing="0.03" fill="#202B35">UC09 Configure adaptive assessments</text>
<text x="1768" y="2449" font-size="36" font-weight="normal" letter-spacing="0.09" fill="#202B35">UC10 Oversee AI-generated question</text>
<text x="596" y="2471" font-size="36" font-weight="normal" letter-spacing="0.03" fill="#202B35">UC17 View competency gap explanations</text>
<text x="1983" y="2493" font-size="36" font-weight="normal" fill="#202B35">candidates</text>
<text x="625" y="2694" font-size="36" font-weight="normal" letter-spacing="0.03" fill="#202B35">UC18 Review assessment history and</text>
<text x="1753" y="2716" font-size="36" font-weight="normal" letter-spacing="0.11" fill="#202B35">UC11 View learner and cohort analytics</text>
<text x="858" y="2738" font-size="36" font-weight="normal" fill="#202B35">evidence</text>
</g>
