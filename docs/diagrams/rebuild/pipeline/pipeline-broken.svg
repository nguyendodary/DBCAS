<g font-family="Arial, Helvetica, sans-serif">
<text x="150" y="120" font-size="31" font-weight="bold" fill="#17191A">Evidence-based Competency &amp; Gap Evaluation Pipeline</text>
<text x="210" y="126" font-size="18" font-weight="normal" fill="#17191A">Complete practice plan frozen before question one • every served item comes from the plan</text>
<text x="270" y="132" font-size="17" font-weight="normal" fill="#17191A">Serve the next item from the frozen plan; repeat until all planned items are served or the 30-minute timer expires</text>
<text x="150" y="138" font-size="20" font-weight="bold" fill="#17191A">Session length 1-20 questions (default 5) · 30-minute expiry · SQL always from the validated bank</text>
<text x="210" y="144" font-size="20" font-weight="bold" fill="#17191A">bank questions used when AI generation falls short are disclosed</text>
<text x="270" y="150" font-size="16" font-weight="normal" fill="#17191A">Ranked gap topics only; long-term learning paths and course-document retrieval are outside scope.</text>
<text x="150" y="156" font-size="22" font-weight="bold" fill="#222527">Plan assembly &amp;</text>
<text x="210" y="162" font-size="22" font-weight="bold" fill="#222527">Practice setup</text>
<text x="270" y="168" font-size="22" font-weight="bold" fill="#222527">Serve planned item</text>
<text x="150" y="174" font-size="22" font-weight="bold" fill="#222527">Grade each answer</text>
<text x="210" y="180" font-size="22" font-weight="bold" fill="#222527">Record evidence</text>
<text x="270" y="186" font-size="22" font-weight="bold" fill="#222527">freeze</text>
<text x="150" y="192" font-size="16" font-weight="normal" fill="#222527">Concepts · difficulty bands</text>
<text x="210" y="198" font-size="16" font-weight="normal" fill="#222527">Only validated bank /</text>
<text x="270" y="204" font-size="16" font-weight="normal" fill="#222527">MCQ key · SQL sandbox ·</text>
<text x="150" y="210" font-size="16" font-weight="normal" fill="#222527">Score · question snapshot ·</text>
<text x="210" y="216" font-size="16" font-weight="normal" fill="#222527">Exact count · selected concepts</text>
<text x="270" y="222" font-size="16" font-weight="normal" fill="#222527">EASY 1–2 / MEDIUM 3 /</text>
<text x="150" y="228" font-size="16" font-weight="normal" fill="#222527">approved AI items, in</text>
<text x="210" y="234" font-size="16" font-weight="normal" fill="#222527">essay rubric (Prompt</text>
<text x="270" y="240" font-size="16" font-weight="normal" fill="#222527">concept tags · validation</text>
<text x="150" y="246" font-size="16" font-weight="normal" fill="#222527">spread as count allows · no</text>
<text x="210" y="252" font-size="16" font-weight="normal" fill="#222527">HARD 4–5 · count 1–20</text>
<text x="270" y="258" font-size="16" font-weight="normal" fill="#222527">the frozen plan order</text>
<text x="150" y="264" font-size="16" font-weight="normal" fill="#222527">Builder → Evaluator)</text>
<text x="210" y="270" font-size="16" font-weight="normal" fill="#222527">flags</text>
<text x="270" y="276" font-size="16" font-weight="normal" fill="#222527">repeated version families · SQL</text>
<text x="150" y="282" font-size="16" font-weight="normal" fill="#222527">(default 5) · source bank</text>
<text x="210" y="288" font-size="16" font-weight="normal" fill="#222527">bank-only · AI MCQ/essay</text>
