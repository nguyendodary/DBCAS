<svg xmlns="http://www.w3.org/2000/svg" width="950" height="1118" viewBox="0 0 950 1118" role="img" aria-label="Entity Relationship Diagram — DBCAS (8/13)">
<title>Entity Relationship Diagram — DBCAS (8/13)</title><desc>41 bảng thật, thuộc tính PK/FK/kiểu/null; legacy/retired = assessment, assessment_blueprint, assessment_concept, assessment_question</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34495e"/></marker><marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa7b4"/></marker></defs>
<rect width="950" height="1118" fill="#ffffff"/>
<text x="24" y="34" font-family="Arial" font-size="26" font-weight="bold" fill="#10254f">Entity Relationship Diagram — DBCAS (8/13)</text>
<text x="30" y="64" font-family="Arial" font-size="13" fill="#5c6c7c">PK = primary key · FK = foreign key · NULL = nullable · legacy/retired tables are shaded amber.</text>
<g id="table_role"><rect x="30" y="92" width="430" height="110" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="92" width="430" height="28" fill="#dceaf7"/><text x="38" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">role</text>
<text x="38" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">role_id: integer PK NOT NULL</text>
<text x="38" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">role_name: character varying(50) NOT NULL</text>
<text x="38" y="180" font-family="Consolas,monospace" font-size="15" fill="#26384a">description: text NULL</text>
</g>
<g id="table_rubric"><rect x="490" y="92" width="430" height="170" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="92" width="430" height="28" fill="#dceaf7"/><text x="498" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">rubric</text>
<text x="498" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">rubric_id: integer PK NOT NULL</text>
<text x="498" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">question_id: integer FK NOT NULL</text>
<text x="498" y="180" font-family="Consolas,monospace" font-size="15" fill="#26384a">level_name: character varying(30) NOT NULL</text>
<text x="498" y="200" font-family="Consolas,monospace" font-size="15" fill="#26384a">min_score: numeric NOT NULL</text>
<text x="498" y="220" font-family="Consolas,monospace" font-size="15" fill="#26384a">max_score: numeric NOT NULL</text>
<text x="498" y="240" font-family="Consolas,monospace" font-size="15" fill="#26384a">criteria: text NOT NULL</text>
</g>
<g id="table_selection_log"><rect x="30" y="286" width="430" height="190" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="286" width="430" height="28" fill="#dceaf7"/><text x="38" y="305" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">selection_log</text>
<text x="38" y="334" font-family="Consolas,monospace" font-size="15" fill="#26384a">log_id: integer PK NOT NULL</text>
<text x="38" y="354" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="38" y="374" font-family="Consolas,monospace" font-size="15" fill="#26384a">seq_no: smallint NOT NULL</text>
<text x="38" y="394" font-family="Consolas,monospace" font-size="15" fill="#26384a">question_id: integer FK NOT NULL</text>
<text x="38" y="414" font-family="Consolas,monospace" font-size="15" fill="#26384a">is_fallback: boolean NOT NULL</text>
<text x="38" y="434" font-family="Consolas,monospace" font-size="15" fill="#26384a">decision_detail: jsonb NULL</text>
<text x="38" y="454" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_session_question_plan"><rect x="490" y="286" width="430" height="110" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="286" width="430" height="28" fill="#dceaf7"/><text x="498" y="305" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">session_question_plan</text>
<text x="498" y="334" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer PK,FK NOT NULL</text>
<text x="498" y="354" font-family="Consolas,monospace" font-size="15" fill="#26384a">seq_no: smallint PK NOT NULL</text>
<text x="498" y="374" font-family="Consolas,monospace" font-size="15" fill="#26384a">question_id: integer FK NOT NULL</text>
</g>
<g id="table_session_result_analysis"><rect x="30" y="500" width="430" height="230" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="500" width="430" height="28" fill="#dceaf7"/><text x="38" y="519" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">session_result_analysis</text>
<text x="38" y="548" font-family="Consolas,monospace" font-size="15" fill="#26384a">analysis_id: bigint PK NOT NULL</text>
<text x="38" y="568" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="38" y="588" font-family="Consolas,monospace" font-size="15" fill="#26384a">result_version_id: bigint FK NOT NULL</text>
<text x="38" y="608" font-family="Consolas,monospace" font-size="15" fill="#26384a">ai1_run_id: bigint FK NOT NULL</text>
<text x="38" y="628" font-family="Consolas,monospace" font-size="15" fill="#26384a">ai2_run_id: bigint FK NOT NULL</text>
<text x="38" y="648" font-family="Consolas,monospace" font-size="15" fill="#26384a">analysis_schema_version: integer NOT NULL</text>
<text x="38" y="668" font-family="Consolas,monospace" font-size="15" fill="#26384a">analysis_hash: character(64) NOT NULL</text>
<text x="38" y="688" font-family="Consolas,monospace" font-size="15" fill="#26384a">analysis: jsonb NOT NULL</text>
<text x="38" y="708" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_session_result_criterion_score"><rect x="490" y="500" width="430" height="210" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="500" width="430" height="28" fill="#dceaf7"/><text x="498" y="519" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">session_result_criterion_score</text>
<text x="498" y="548" font-family="Consolas,monospace" font-size="15" fill="#26384a">criterion_score_id: bigint PK NOT NULL</text>
<text x="498" y="568" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="498" y="588" font-family="Consolas,monospace" font-size="15" fill="#26384a">result_version_id: bigint FK NOT NULL</text>
<text x="498" y="608" font-family="Consolas,monospace" font-size="15" fill="#26384a">attempt_id: integer FK NOT NULL</text>
<text x="498" y="628" font-family="Consolas,monospace" font-size="15" fill="#26384a">criterion_snapshot_id: bigint FK NOT NULL</text>
<text x="498" y="648" font-family="Consolas,monospace" font-size="15" fill="#26384a">score: numeric NOT NULL</text>
<text x="498" y="668" font-family="Consolas,monospace" font-size="15" fill="#26384a">max_points: numeric NOT NULL</text>
<text x="498" y="688" font-family="Consolas,monospace" font-size="15" fill="#26384a">comment: character varying(2000) NULL</text>
</g>
<g id="table_session_result_publication"><rect x="30" y="754" width="430" height="210" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="754" width="430" height="28" fill="#dceaf7"/><text x="38" y="773" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">session_result_publication</text>
<text x="38" y="802" font-family="Consolas,monospace" font-size="15" fill="#26384a">result_version_id: bigint PK,FK NOT NULL</text>
<text x="38" y="822" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="38" y="842" font-family="Consolas,monospace" font-size="15" fill="#26384a">state: character varying(30) NOT NULL</text>
<text x="38" y="862" font-family="Consolas,monospace" font-size="15" fill="#26384a">state_revision: integer NOT NULL</text>
<text x="38" y="882" font-family="Consolas,monospace" font-size="15" fill="#26384a">published_at: timestamp with time zone NULL</text>
<text x="38" y="902" font-family="Consolas,monospace" font-size="15" fill="#26384a">analysis_failed_at: timestamp with time zone NULL</text>
<text x="38" y="922" font-family="Consolas,monospace" font-size="15" fill="#26384a">updated_at: timestamp with time zone NOT NULL</text>
<text x="38" y="942" font-family="Consolas,monospace" font-size="15" fill="#26384a">updated_by: integer FK NULL</text>
</g>
<g id="table_session_result_version"><rect x="490" y="754" width="430" height="310" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="754" width="430" height="28" fill="#dceaf7"/><text x="498" y="773" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">session_result_version</text>
<text x="498" y="802" font-family="Consolas,monospace" font-size="15" fill="#26384a">result_version_id: bigint PK NOT NULL</text>
<text x="498" y="822" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="498" y="842" font-family="Consolas,monospace" font-size="15" fill="#26384a">version_no: integer NOT NULL</text>
<text x="498" y="862" font-family="Consolas,monospace" font-size="15" fill="#26384a">source: character varying(10) NOT NULL</text>
<text x="498" y="882" font-family="Consolas,monospace" font-size="15" fill="#26384a">supersedes_version_id: bigint FK NULL</text>
<text x="498" y="902" font-family="Consolas,monospace" font-size="15" fill="#26384a">total_score: numeric NOT NULL</text>
<text x="498" y="922" font-family="Consolas,monospace" font-size="15" fill="#26384a">max_score: numeric NOT NULL</text>
<text x="498" y="942" font-family="Consolas,monospace" font-size="15" fill="#26384a">result_hash: character(64) NOT NULL</text>
<text x="498" y="962" font-family="Consolas,monospace" font-size="15" fill="#26384a">approved_by: integer FK NULL</text>
<text x="498" y="982" font-family="Consolas,monospace" font-size="15" fill="#26384a">approved_at: timestamp with time zone NOT NULL</text>
<text x="498" y="1002" font-family="Consolas,monospace" font-size="15" fill="#26384a">approved_draft_hash: character(64) NULL</text>
<text x="498" y="1022" font-family="Consolas,monospace" font-size="15" fill="#26384a">approved_review_revision: integer NOT NULL</text>
<text x="498" y="1042" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
</svg>
