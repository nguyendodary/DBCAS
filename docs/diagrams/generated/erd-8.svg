<svg xmlns="http://www.w3.org/2000/svg" width="950" height="1164" viewBox="0 0 950 1164" role="img" aria-label="Entity Relationship Diagram — DBCAS (8/14)">
<title>Entity Relationship Diagram — DBCAS (8/14)</title><desc>41 bảng thật, thuộc tính PK/FK/kiểu/null; legacy/retired = assessment, assessment_blueprint, assessment_concept, assessment_question</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34495e"/></marker><marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa7b4"/></marker></defs>
<rect width="950" height="1164" fill="#ffffff"/>
<text x="24" y="34" font-family="Arial" font-size="26" font-weight="bold" fill="#10254f">Entity Relationship Diagram — DBCAS (8/14)</text>
<text x="30" y="64" font-family="Arial" font-size="13" fill="#5c6c7c">PK = primary key · FK = foreign key · NULL = nullable · legacy/retired tables are shaded amber.</text>
<g id="table_retention_purge_audit"><rect x="30" y="92" width="430" height="210" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="92" width="430" height="28" fill="#dceaf7"/><text x="38" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">retention_purge_audit</text>
<text x="38" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">purge_audit_id: bigint PK NOT NULL</text>
<text x="38" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">object_type: character varying(20) NOT NULL</text>
<text x="38" y="180" font-family="Consolas,monospace" font-size="15" fill="#26384a">object_id: text NOT NULL</text>
<text x="38" y="200" font-family="Consolas,monospace" font-size="15" fill="#26384a">content_hash: character(64) NULL</text>
<text x="38" y="220" font-family="Consolas,monospace" font-size="15" fill="#26384a">purged_at: timestamp with time zone NOT NULL</text>
<text x="38" y="240" font-family="Consolas,monospace" font-size="15" fill="#26384a">purge_reason: character varying(40) NOT NULL</text>
<text x="38" y="260" font-family="Consolas,monospace" font-size="15" fill="#26384a">actor: character varying(80) NOT NULL</text>
<text x="38" y="280" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_review_deviation"><rect x="490" y="92" width="430" height="330" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="92" width="430" height="28" fill="#dceaf7"/><text x="498" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">review_deviation</text>
<text x="498" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">deviation_id: bigint PK NOT NULL</text>
<text x="498" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">review_request_id: bigint FK NOT NULL</text>
<text x="498" y="180" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="498" y="200" font-family="Consolas,monospace" font-size="15" fill="#26384a">attempt_id: integer FK NOT NULL</text>
<text x="498" y="220" font-family="Consolas,monospace" font-size="15" fill="#26384a">criterion_snapshot_id: bigint FK NULL</text>
<text x="498" y="240" font-family="Consolas,monospace" font-size="15" fill="#26384a">ai_score: numeric NOT NULL</text>
<text x="498" y="260" font-family="Consolas,monospace" font-size="15" fill="#26384a">reviewed_score: numeric NOT NULL</text>
<text x="498" y="280" font-family="Consolas,monospace" font-size="15" fill="#26384a">max_points: numeric NOT NULL</text>
<text x="498" y="300" font-family="Consolas,monospace" font-size="15" fill="#26384a">deviation_ratio: numeric NOT NULL</text>
<text x="498" y="320" font-family="Consolas,monospace" font-size="15" fill="#26384a">reason: character varying(4000) NOT NULL</text>
<text x="498" y="340" font-family="Consolas,monospace" font-size="15" fill="#26384a">first_reviewer_id: integer FK NOT NULL</text>
<text x="498" y="360" font-family="Consolas,monospace" font-size="15" fill="#26384a">second_reviewer_id: integer FK NULL</text>
<text x="498" y="380" font-family="Consolas,monospace" font-size="15" fill="#26384a">confirmation: character varying(24) NOT NULL</text>
<text x="498" y="400" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_review_request"><rect x="30" y="446" width="430" height="450" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="446" width="430" height="28" fill="#dceaf7"/><text x="38" y="465" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">review_request</text>
<text x="38" y="494" font-family="Consolas,monospace" font-size="15" fill="#26384a">review_request_id: bigint PK NOT NULL</text>
<text x="38" y="514" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="38" y="534" font-family="Consolas,monospace" font-size="15" fill="#26384a">learner_id: integer FK NOT NULL</text>
<text x="38" y="554" font-family="Consolas,monospace" font-size="15" fill="#26384a">requested_by: integer FK NOT NULL</text>
<text x="38" y="574" font-family="Consolas,monospace" font-size="15" fill="#26384a">origin: character varying(12) NOT NULL</text>
<text x="38" y="594" font-family="Consolas,monospace" font-size="15" fill="#26384a">request_key: uuid NOT NULL</text>
<text x="38" y="614" font-family="Consolas,monospace" font-size="15" fill="#26384a">reason: character varying(2000) NOT NULL</text>
<text x="38" y="634" font-family="Consolas,monospace" font-size="15" fill="#26384a">status: character varying(20) NOT NULL</text>
<text x="38" y="654" font-family="Consolas,monospace" font-size="15" fill="#26384a">base_result_version_id: bigint FK NOT NULL</text>
<text x="38" y="674" font-family="Consolas,monospace" font-size="15" fill="#26384a">requested_at: timestamp with time zone NOT NULL</text>
<text x="38" y="694" font-family="Consolas,monospace" font-size="15" fill="#26384a">window_expires_at: timestamp with time zone NULL</text>
<text x="38" y="714" font-family="Consolas,monospace" font-size="15" fill="#26384a">claimed_by: integer FK NULL</text>
<text x="38" y="734" font-family="Consolas,monospace" font-size="15" fill="#26384a">claimed_at: timestamp with time zone NULL</text>
<text x="38" y="754" font-family="Consolas,monospace" font-size="15" fill="#26384a">claim_expires_at: timestamp with time zone NULL</text>
<text x="38" y="774" font-family="Consolas,monospace" font-size="15" fill="#26384a">resolved_by: integer FK NULL</text>
<text x="38" y="794" font-family="Consolas,monospace" font-size="15" fill="#26384a">resolved_at: timestamp with time zone NULL</text>
<text x="38" y="814" font-family="Consolas,monospace" font-size="15" fill="#26384a">resolution_note: character varying(2000) NULL</text>
<text x="38" y="834" font-family="Consolas,monospace" font-size="15" fill="#26384a">regraded_result_version_id: bigint FK NULL</text>
<text x="38" y="854" font-family="Consolas,monospace" font-size="15" fill="#26384a">revision: integer NOT NULL</text>
<text x="38" y="874" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_role"><rect x="490" y="446" width="430" height="110" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="446" width="430" height="28" fill="#dceaf7"/><text x="498" y="465" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">role</text>
<text x="498" y="494" font-family="Consolas,monospace" font-size="15" fill="#26384a">role_id: integer PK NOT NULL</text>
<text x="498" y="514" font-family="Consolas,monospace" font-size="15" fill="#26384a">role_name: character varying(50) NOT NULL</text>
<text x="498" y="534" font-family="Consolas,monospace" font-size="15" fill="#26384a">description: text NULL</text>
</g>
<g id="table_rubric"><rect x="30" y="920" width="430" height="170" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="920" width="430" height="28" fill="#dceaf7"/><text x="38" y="939" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">rubric</text>
<text x="38" y="968" font-family="Consolas,monospace" font-size="15" fill="#26384a">rubric_id: integer PK NOT NULL</text>
<text x="38" y="988" font-family="Consolas,monospace" font-size="15" fill="#26384a">question_id: integer FK NOT NULL</text>
<text x="38" y="1008" font-family="Consolas,monospace" font-size="15" fill="#26384a">level_name: character varying(30) NOT NULL</text>
<text x="38" y="1028" font-family="Consolas,monospace" font-size="15" fill="#26384a">min_score: numeric NOT NULL</text>
<text x="38" y="1048" font-family="Consolas,monospace" font-size="15" fill="#26384a">max_score: numeric NOT NULL</text>
<text x="38" y="1068" font-family="Consolas,monospace" font-size="15" fill="#26384a">criteria: text NOT NULL</text>
</g>
<g id="table_selection_log"><rect x="490" y="920" width="430" height="190" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="920" width="430" height="28" fill="#dceaf7"/><text x="498" y="939" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">selection_log</text>
<text x="498" y="968" font-family="Consolas,monospace" font-size="15" fill="#26384a">log_id: integer PK NOT NULL</text>
<text x="498" y="988" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="498" y="1008" font-family="Consolas,monospace" font-size="15" fill="#26384a">seq_no: smallint NOT NULL</text>
<text x="498" y="1028" font-family="Consolas,monospace" font-size="15" fill="#26384a">question_id: integer FK NOT NULL</text>
<text x="498" y="1048" font-family="Consolas,monospace" font-size="15" fill="#26384a">is_fallback: boolean NOT NULL</text>
<text x="498" y="1068" font-family="Consolas,monospace" font-size="15" fill="#26384a">decision_detail: jsonb NULL</text>
<text x="498" y="1088" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
</svg>
