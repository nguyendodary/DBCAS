<svg xmlns="http://www.w3.org/2000/svg" width="950" height="1084" viewBox="0 0 950 1084" role="img" aria-label="Entity Relationship Diagram — DBCAS (9/14)">
<title>Entity Relationship Diagram — DBCAS (9/14)</title><desc>41 bảng thật, thuộc tính PK/FK/kiểu/null; legacy/retired = assessment, assessment_blueprint, assessment_concept, assessment_question</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34495e"/></marker><marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa7b4"/></marker></defs>
<rect width="950" height="1084" fill="#ffffff"/>
<text x="24" y="34" font-family="Arial" font-size="26" font-weight="bold" fill="#10254f">Entity Relationship Diagram — DBCAS (9/14)</text>
<text x="30" y="64" font-family="Arial" font-size="13" fill="#5c6c7c">PK = primary key · FK = foreign key · NULL = nullable · legacy/retired tables are shaded amber.</text>
<g id="table_session_final_result"><rect x="30" y="92" width="430" height="330" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="92" width="430" height="28" fill="#dceaf7"/><text x="38" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">session_final_result</text>
<text x="38" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">result_id: integer PK NOT NULL</text>
<text x="38" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="38" y="180" font-family="Consolas,monospace" font-size="15" fill="#26384a">reviewer_id: integer FK NULL</text>
<text x="38" y="200" font-family="Consolas,monospace" font-size="15" fill="#26384a">source: character varying(20) NOT NULL</text>
<text x="38" y="220" font-family="Consolas,monospace" font-size="15" fill="#26384a">evaluation_input_hash: character varying(64) NOT NULL</text>
<text x="38" y="240" font-family="Consolas,monospace" font-size="15" fill="#26384a">approval_revision: integer NOT NULL</text>
<text x="38" y="260" font-family="Consolas,monospace" font-size="15" fill="#26384a">ai_evaluation: jsonb NOT NULL</text>
<text x="38" y="280" font-family="Consolas,monospace" font-size="15" fill="#26384a">final_evaluation: jsonb NOT NULL</text>
<text x="38" y="300" font-family="Consolas,monospace" font-size="15" fill="#26384a">concept_results: jsonb NOT NULL</text>
<text x="38" y="320" font-family="Consolas,monospace" font-size="15" fill="#26384a">scores: jsonb NOT NULL</text>
<text x="38" y="340" font-family="Consolas,monospace" font-size="15" fill="#26384a">overall: jsonb NOT NULL</text>
<text x="38" y="360" font-family="Consolas,monospace" font-size="15" fill="#26384a">uncovered_concepts: jsonb NOT NULL</text>
<text x="38" y="380" font-family="Consolas,monospace" font-size="15" fill="#26384a">approved_at: timestamp with time zone NOT NULL</text>
<text x="38" y="400" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_session_question_plan"><rect x="490" y="92" width="430" height="110" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="92" width="430" height="28" fill="#dceaf7"/><text x="498" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">session_question_plan</text>
<text x="498" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer PK,FK NOT NULL</text>
<text x="498" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">seq_no: smallint PK NOT NULL</text>
<text x="498" y="180" font-family="Consolas,monospace" font-size="15" fill="#26384a">question_id: integer FK NOT NULL</text>
</g>
<g id="table_session_result_analysis"><rect x="30" y="446" width="430" height="230" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="446" width="430" height="28" fill="#dceaf7"/><text x="38" y="465" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">session_result_analysis</text>
<text x="38" y="494" font-family="Consolas,monospace" font-size="15" fill="#26384a">analysis_id: bigint PK NOT NULL</text>
