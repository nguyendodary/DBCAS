<text x="38" y="828" font-family="Consolas,monospace" font-size="15" fill="#26384a">published_at: timestamp with time zone NULL</text>
<text x="38" y="848" font-family="Consolas,monospace" font-size="15" fill="#26384a">analysis_failed_at: timestamp with time zone NULL</text>
<text x="38" y="868" font-family="Consolas,monospace" font-size="15" fill="#26384a">updated_at: timestamp with time zone NOT NULL</text>
<text x="38" y="888" font-family="Consolas,monospace" font-size="15" fill="#26384a">updated_by: integer FK NULL</text>
</g>
<g id="table_session_result_version"><rect x="490" y="700" width="430" height="330" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="700" width="430" height="28" fill="#dceaf7"/><text x="498" y="719" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">session_result_version</text>
<text x="498" y="748" font-family="Consolas,monospace" font-size="15" fill="#26384a">result_version_id: bigint PK NOT NULL</text>
<text x="498" y="768" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="498" y="788" font-family="Consolas,monospace" font-size="15" fill="#26384a">version_no: integer NOT NULL</text>
<text x="498" y="808" font-family="Consolas,monospace" font-size="15" fill="#26384a">source: character varying(10) NOT NULL</text>
<text x="498" y="828" font-family="Consolas,monospace" font-size="15" fill="#26384a">supersedes_version_id: bigint FK NULL</text>
<text x="498" y="848" font-family="Consolas,monospace" font-size="15" fill="#26384a">total_score: numeric NOT NULL</text>
<text x="498" y="868" font-family="Consolas,monospace" font-size="15" fill="#26384a">max_score: numeric NOT NULL</text>
<text x="498" y="888" font-family="Consolas,monospace" font-size="15" fill="#26384a">result_hash: character(64) NOT NULL</text>
