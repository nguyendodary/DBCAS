<text x="38" y="574" font-family="Consolas,monospace" font-size="15" fill="#26384a">ai2_run_id: bigint FK NOT NULL</text>
<text x="38" y="594" font-family="Consolas,monospace" font-size="15" fill="#26384a">analysis_schema_version: integer NOT NULL</text>
<text x="38" y="614" font-family="Consolas,monospace" font-size="15" fill="#26384a">analysis_hash: character(64) NOT NULL</text>
<text x="38" y="634" font-family="Consolas,monospace" font-size="15" fill="#26384a">analysis: jsonb NOT NULL</text>
<text x="38" y="654" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_session_result_criterion_score"><rect x="490" y="446" width="430" height="210" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="446" width="430" height="28" fill="#dceaf7"/><text x="498" y="465" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">session_result_criterion_score</text>
<text x="498" y="494" font-family="Consolas,monospace" font-size="15" fill="#26384a">criterion_score_id: bigint PK NOT NULL</text>
<text x="498" y="514" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="498" y="534" font-family="Consolas,monospace" font-size="15" fill="#26384a">result_version_id: bigint FK NOT NULL</text>
<text x="498" y="554" font-family="Consolas,monospace" font-size="15" fill="#26384a">attempt_id: integer FK NOT NULL</text>
<text x="498" y="574" font-family="Consolas,monospace" font-size="15" fill="#26384a">criterion_snapshot_id: bigint FK NOT NULL</text>
<text x="498" y="594" font-family="Consolas,monospace" font-size="15" fill="#26384a">score: numeric NOT NULL</text>
<text x="498" y="614" font-family="Consolas,monospace" font-size="15" fill="#26384a">max_points: numeric NOT NULL</text>
<text x="498" y="634" font-family="Consolas,monospace" font-size="15" fill="#26384a">comment: character varying(2000) NULL</text>
</g>
<g id="table_session_result_publication"><rect x="30" y="700" width="430" height="210" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="700" width="430" height="28" fill="#dceaf7"/><text x="38" y="719" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">session_result_publication</text>
<text x="38" y="748" font-family="Consolas,monospace" font-size="15" fill="#26384a">result_version_id: bigint PK,FK NOT NULL</text>
<text x="38" y="768" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
