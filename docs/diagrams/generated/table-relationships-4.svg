<rect width="950" height="744" fill="#ffffff"/>
<text x="24" y="34" font-family="Arial" font-size="26" font-weight="bold" fill="#10254f">Table Relationship Diagram — DBCAS (4/4)</text>
<text x="30" y="64" font-family="Arial" font-size="14" fill="#5c6c7c">Mỗi mũi tên đi từ bảng con (chứa FK) tới bảng cha (khóa được tham chiếu).</text>
