<svg xmlns="http://www.w3.org/2000/svg" width="950" height="924" viewBox="0 0 950 924" role="img" aria-label="Entity Relationship Diagram — DBCAS (1/9)">
<title>Entity Relationship Diagram — DBCAS (1/9)</title><desc>41 bảng thật, thuộc tính PK/FK/kiểu/null; legacy/retired = assessment, assessment_blueprint, assessment_concept, assessment_question</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34495e"/></marker><marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa7b4"/></marker></defs>
<rect width="950" height="924" fill="#ffffff"/>
<text x="24" y="34" font-family="Arial" font-size="26" font-weight="bold" fill="#10254f">Entity Relationship Diagram — DBCAS (1/9)</text>
<text x="30" y="64" font-family="Arial" font-size="13" fill="#5c6c7c">PK = primary key · FK = foreign key · NULL = nullable · legacy/retired tables are shaded amber.</text>
<g id="table_account"><rect x="30" y="92" width="430" height="210" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="92" width="430" height="28" fill="#dceaf7"/><text x="38" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">account</text>
<text x="38" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">account_id: integer PK NOT NULL</text>
<text x="38" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">email: character varying(255) NOT NULL</text>
<text x="38" y="180" font-family="Consolas,monospace" font-size="15" fill="#26384a">password_hash: character varying(255) NOT NULL</text>
<text x="38" y="200" font-family="Consolas,monospace" font-size="15" fill="#26384a">password_set: boolean NOT NULL</text>
<text x="38" y="220" font-family="Consolas,monospace" font-size="15" fill="#26384a">password_changed_at: timestamp with time zone NULL</text>
<text x="38" y="240" font-family="Consolas,monospace" font-size="15" fill="#26384a">status: character varying(20) NOT NULL</text>
<text x="38" y="260" font-family="Consolas,monospace" font-size="15" fill="#26384a">can_manage_roles: boolean NOT NULL</text>
<text x="38" y="280" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_account_identity"><rect x="490" y="92" width="430" height="190" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="92" width="430" height="28" fill="#dceaf7"/><text x="498" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">account_identity</text>
<text x="498" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">identity_id: integer PK NOT NULL</text>
<text x="498" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">account_id: integer FK NOT NULL</text>
<text x="498" y="180" font-family="Consolas,monospace" font-size="15" fill="#26384a">provider: character varying(20) NOT NULL</text>
<text x="498" y="200" font-family="Consolas,monospace" font-size="15" fill="#26384a">provider_user_id: character varying(255) NOT NULL</text>
<text x="498" y="220" font-family="Consolas,monospace" font-size="15" fill="#26384a">provider_email: character varying(255) NULL</text>
<text x="498" y="240" font-family="Consolas,monospace" font-size="15" fill="#26384a">email_verified: boolean NOT NULL</text>
<text x="498" y="260" font-family="Consolas,monospace" font-size="15" fill="#26384a">linked_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_account_role"><rect x="30" y="326" width="430" height="110" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="326" width="430" height="28" fill="#dceaf7"/><text x="38" y="345" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">account_role</text>
<text x="38" y="374" font-family="Consolas,monospace" font-size="15" fill="#26384a">account_id: integer PK,FK NOT NULL</text>
<text x="38" y="394" font-family="Consolas,monospace" font-size="15" fill="#26384a">role_id: integer PK,FK NOT NULL</text>
<text x="38" y="414" font-family="Consolas,monospace" font-size="15" fill="#26384a">assigned_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_account_role_audit"><rect x="490" y="326" width="430" height="190" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="326" width="430" height="28" fill="#dceaf7"/><text x="498" y="345" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">account_role_audit</text>
<text x="498" y="374" font-family="Consolas,monospace" font-size="15" fill="#26384a">audit_id: bigint PK NOT NULL</text>
<text x="498" y="394" font-family="Consolas,monospace" font-size="15" fill="#26384a">action_type: character varying(40) NOT NULL</text>
<text x="498" y="414" font-family="Consolas,monospace" font-size="15" fill="#26384a">actor_account_id: integer FK NULL</text>
<text x="498" y="434" font-family="Consolas,monospace" font-size="15" fill="#26384a">target_account_id: integer FK NOT NULL</text>
<text x="498" y="454" font-family="Consolas,monospace" font-size="15" fill="#26384a">previous_role: character varying(50) NULL</text>
<text x="498" y="474" font-family="Consolas,monospace" font-size="15" fill="#26384a">new_role: character varying(50) NULL</text>
<text x="498" y="494" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_adaptive_event"><rect x="30" y="540" width="430" height="150" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="540" width="430" height="28" fill="#dceaf7"/><text x="38" y="559" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">adaptive_event</text>
<text x="38" y="588" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer PK,FK NOT NULL</text>
<text x="38" y="608" font-family="Consolas,monospace" font-size="15" fill="#26384a">round_no: smallint PK NOT NULL</text>
<text x="38" y="628" font-family="Consolas,monospace" font-size="15" fill="#26384a">event_type: character varying(16) PK NOT NULL</text>
<text x="38" y="648" font-family="Consolas,monospace" font-size="15" fill="#26384a">payload: jsonb NOT NULL</text>
<text x="38" y="668" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_assessment"><rect x="490" y="540" width="430" height="330" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="540" width="430" height="28" fill="#f6d99a"/><text x="498" y="559" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">assessment [legacy/retired]</text>
<text x="498" y="588" font-family="Consolas,monospace" font-size="15" fill="#26384a">assessment_id: integer PK NOT NULL</text>
<text x="498" y="608" font-family="Consolas,monospace" font-size="15" fill="#26384a">title: character varying(200) NOT NULL</text>
<text x="498" y="628" font-family="Consolas,monospace" font-size="15" fill="#26384a">description: text NULL</text>
<text x="498" y="648" font-family="Consolas,monospace" font-size="15" fill="#26384a">max_questions: smallint NOT NULL</text>
<text x="498" y="668" font-family="Consolas,monospace" font-size="15" fill="#26384a">duration_min: smallint NOT NULL</text>
<text x="498" y="688" font-family="Consolas,monospace" font-size="15" fill="#26384a">target_mcq: smallint NOT NULL</text>
<text x="498" y="708" font-family="Consolas,monospace" font-size="15" fill="#26384a">target_sql: smallint NOT NULL</text>
<text x="498" y="728" font-family="Consolas,monospace" font-size="15" fill="#26384a">target_essay: smallint NOT NULL</text>
<text x="498" y="748" font-family="Consolas,monospace" font-size="15" fill="#26384a">status: character varying(20) NOT NULL</text>
<text x="498" y="768" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_by: integer FK NOT NULL</text>
<text x="498" y="788" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
<text x="498" y="808" font-family="Consolas,monospace" font-size="15" fill="#26384a">family_id: integer FK NULL</text>
<text x="498" y="828" font-family="Consolas,monospace" font-size="15" fill="#26384a">version_no: integer NOT NULL</text>
<text x="498" y="848" font-family="Consolas,monospace" font-size="15" fill="#26384a">result_release_policy: character varying(20) NOT NULL</text>
</g>
</svg>
