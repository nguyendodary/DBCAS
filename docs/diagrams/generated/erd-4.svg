<svg xmlns="http://www.w3.org/2000/svg" width="950" height="984" viewBox="0 0 950 984" role="img" aria-label="Entity Relationship Diagram — DBCAS (4/11)">
<title>Entity Relationship Diagram — DBCAS (4/11)</title><desc>41 bảng thật, thuộc tính PK/FK/kiểu/null; legacy/retired = assessment, assessment_blueprint, assessment_concept, assessment_question</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34495e"/></marker><marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa7b4"/></marker></defs>
<rect width="950" height="984" fill="#ffffff"/>
<text x="24" y="34" font-family="Arial" font-size="26" font-weight="bold" fill="#10254f">Entity Relationship Diagram — DBCAS (4/11)</text>
<text x="30" y="64" font-family="Arial" font-size="13" fill="#5c6c7c">PK = primary key · FK = foreign key · NULL = nullable · legacy/retired tables are shaded amber.</text>
<g id="table_course_document"><rect x="30" y="92" width="430" height="330" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="92" width="430" height="28" fill="#dceaf7"/><text x="38" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">course_document</text>
<text x="38" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">document_id: integer PK NOT NULL</text>
<text x="38" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">title: character varying(300) NOT NULL</text>
<text x="38" y="180" font-family="Consolas,monospace" font-size="15" fill="#26384a">source_type: character varying(20) NOT NULL</text>
<text x="38" y="200" font-family="Consolas,monospace" font-size="15" fill="#26384a">mime_type: character varying(100) NOT NULL</text>
<text x="38" y="220" font-family="Consolas,monospace" font-size="15" fill="#26384a">original_filename: character varying(255) NULL</text>
<text x="38" y="240" font-family="Consolas,monospace" font-size="15" fill="#26384a">sha256: character varying(64) NOT NULL</text>
<text x="38" y="260" font-family="Consolas,monospace" font-size="15" fill="#26384a">char_count: integer NOT NULL</text>
<text x="38" y="280" font-family="Consolas,monospace" font-size="15" fill="#26384a">page_count: integer NULL</text>
<text x="38" y="300" font-family="Consolas,monospace" font-size="15" fill="#26384a">status: character varying(20) NOT NULL</text>
<text x="38" y="320" font-family="Consolas,monospace" font-size="15" fill="#26384a">uploaded_by: integer FK NOT NULL</text>
<text x="38" y="340" font-family="Consolas,monospace" font-size="15" fill="#26384a">uploaded_at: timestamp with time zone NOT NULL</text>
<text x="38" y="360" font-family="Consolas,monospace" font-size="15" fill="#26384a">approved_by: integer FK NULL</text>
<text x="38" y="380" font-family="Consolas,monospace" font-size="15" fill="#26384a">approved_at: timestamp with time zone NULL</text>
<text x="38" y="400" font-family="Consolas,monospace" font-size="15" fill="#26384a">text_policy_version: character varying(20) NOT NULL</text>
</g>
<g id="table_course_learning_outcome"><rect x="490" y="92" width="430" height="190" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="92" width="430" height="28" fill="#dceaf7"/><text x="498" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">course_learning_outcome</text>
<text x="498" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">clo_id: integer PK NOT NULL</text>
<text x="498" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">clo_code: character varying(20) NOT NULL</text>
<text x="498" y="180" font-family="Consolas,monospace" font-size="15" fill="#26384a">title: character varying(200) NOT NULL</text>
<text x="498" y="200" font-family="Consolas,monospace" font-size="15" fill="#26384a">description: text NULL</text>
<text x="498" y="220" font-family="Consolas,monospace" font-size="15" fill="#26384a">status: character varying(20) NOT NULL</text>
<text x="498" y="240" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_by: integer FK NOT NULL</text>
<text x="498" y="260" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_document_chunk"><rect x="30" y="446" width="430" height="230" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="446" width="430" height="28" fill="#dceaf7"/><text x="38" y="465" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">document_chunk</text>
<text x="38" y="494" font-family="Consolas,monospace" font-size="15" fill="#26384a">chunk_id: integer PK NOT NULL</text>
<text x="38" y="514" font-family="Consolas,monospace" font-size="15" fill="#26384a">document_id: integer FK NOT NULL</text>
<text x="38" y="534" font-family="Consolas,monospace" font-size="15" fill="#26384a">ordinal: integer NOT NULL</text>
<text x="38" y="554" font-family="Consolas,monospace" font-size="15" fill="#26384a">page_from: integer NULL</text>
<text x="38" y="574" font-family="Consolas,monospace" font-size="15" fill="#26384a">page_to: integer NULL</text>
<text x="38" y="594" font-family="Consolas,monospace" font-size="15" fill="#26384a">heading: text NULL</text>
<text x="38" y="614" font-family="Consolas,monospace" font-size="15" fill="#26384a">text: text NOT NULL</text>
<text x="38" y="634" font-family="Consolas,monospace" font-size="15" fill="#26384a">text_hash: character varying(64) NOT NULL</text>
<text x="38" y="654" font-family="Consolas,monospace" font-size="15" fill="#26384a">char_count: integer NOT NULL</text>
</g>
<g id="table_document_clo"><rect x="490" y="446" width="430" height="150" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="446" width="430" height="28" fill="#dceaf7"/><text x="498" y="465" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">document_clo</text>
<text x="498" y="494" font-family="Consolas,monospace" font-size="15" fill="#26384a">document_id: integer PK,FK NOT NULL</text>
<text x="498" y="514" font-family="Consolas,monospace" font-size="15" fill="#26384a">clo_id: integer PK,FK NOT NULL</text>
<text x="498" y="534" font-family="Consolas,monospace" font-size="15" fill="#26384a">status: character varying(20) NOT NULL</text>
<text x="498" y="554" font-family="Consolas,monospace" font-size="15" fill="#26384a">approved_by: integer FK NULL</text>
<text x="498" y="574" font-family="Consolas,monospace" font-size="15" fill="#26384a">approved_at: timestamp with time zone NULL</text>
</g>
<g id="table_evaluation_record"><rect x="30" y="700" width="430" height="230" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="700" width="430" height="28" fill="#dceaf7"/><text x="38" y="719" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">evaluation_record</text>
<text x="38" y="748" font-family="Consolas,monospace" font-size="15" fill="#26384a">evaluation_id: integer PK NOT NULL</text>
<text x="38" y="768" font-family="Consolas,monospace" font-size="15" fill="#26384a">learner_id: integer FK NOT NULL</text>
<text x="38" y="788" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NULL</text>
<text x="38" y="808" font-family="Consolas,monospace" font-size="15" fill="#26384a">scope_key: character varying(80) NOT NULL</text>
<text x="38" y="828" font-family="Consolas,monospace" font-size="15" fill="#26384a">input_hash: character varying(64) NOT NULL</text>
<text x="38" y="848" font-family="Consolas,monospace" font-size="15" fill="#26384a">status: character varying(20) NOT NULL</text>
<text x="38" y="868" font-family="Consolas,monospace" font-size="15" fill="#26384a">payload: jsonb NULL</text>
<text x="38" y="888" font-family="Consolas,monospace" font-size="15" fill="#26384a">lease_until: timestamp with time zone NULL</text>
<text x="38" y="908" font-family="Consolas,monospace" font-size="15" fill="#26384a">updated_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_grade_edit_audit"><rect x="490" y="700" width="430" height="190" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="700" width="430" height="28" fill="#dceaf7"/><text x="498" y="719" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">grade_edit_audit</text>
<text x="498" y="748" font-family="Consolas,monospace" font-size="15" fill="#26384a">audit_id: integer PK NOT NULL</text>
<text x="498" y="768" font-family="Consolas,monospace" font-size="15" fill="#26384a">attempt_id: integer FK NOT NULL</text>
<text x="498" y="788" font-family="Consolas,monospace" font-size="15" fill="#26384a">reviewer_id: integer FK NOT NULL</text>
<text x="498" y="808" font-family="Consolas,monospace" font-size="15" fill="#26384a">old_score: numeric NULL</text>
<text x="498" y="828" font-family="Consolas,monospace" font-size="15" fill="#26384a">new_score: numeric NOT NULL</text>
<text x="498" y="848" font-family="Consolas,monospace" font-size="15" fill="#26384a">reason: character varying(1000) NOT NULL</text>
<text x="498" y="868" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
</g>
</svg>
