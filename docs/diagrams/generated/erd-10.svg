<svg xmlns="http://www.w3.org/2000/svg" width="950" height="744" viewBox="0 0 950 744" role="img" aria-label="Entity Relationship Diagram — DBCAS (10/14)">
<title>Entity Relationship Diagram — DBCAS (10/14)</title><desc>41 bảng thật, thuộc tính PK/FK/kiểu/null; legacy/retired = assessment, assessment_blueprint, assessment_concept, assessment_question</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34495e"/></marker><marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa7b4"/></marker></defs>
<rect width="950" height="744" fill="#ffffff"/>
<text x="24" y="34" font-family="Arial" font-size="26" font-weight="bold" fill="#10254f">Entity Relationship Diagram — DBCAS (10/14)</text>
<text x="30" y="64" font-family="Arial" font-size="13" fill="#5c6c7c">PK = primary key · FK = foreign key · NULL = nullable · legacy/retired tables are shaded amber.</text>
<g id="table_session_result_version_score"><rect x="30" y="92" width="430" height="190" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="92" width="430" height="28" fill="#dceaf7"/><text x="38" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">session_result_version_score</text>
<text x="38" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">version_score_id: bigint PK NOT NULL</text>
<text x="38" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="38" y="180" font-family="Consolas,monospace" font-size="15" fill="#26384a">result_version_id: bigint FK NOT NULL</text>
<text x="38" y="200" font-family="Consolas,monospace" font-size="15" fill="#26384a">attempt_id: integer FK NOT NULL</text>
<text x="38" y="220" font-family="Consolas,monospace" font-size="15" fill="#26384a">score: numeric NOT NULL</text>
<text x="38" y="240" font-family="Consolas,monospace" font-size="15" fill="#26384a">max_score: numeric NOT NULL</text>
<text x="38" y="260" font-family="Consolas,monospace" font-size="15" fill="#26384a">source: character varying(20) NOT NULL</text>
</g>
<g id="table_session_start_request"><rect x="490" y="92" width="430" height="150" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="92" width="430" height="28" fill="#dceaf7"/><text x="498" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">session_start_request</text>
<text x="498" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">learner_id: integer PK,FK NOT NULL</text>
<text x="498" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">request_id: character varying(36) PK NOT NULL</text>
<text x="498" y="180" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="498" y="200" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
<text x="498" y="220" font-family="Consolas,monospace" font-size="15" fill="#26384a">request_hash: character(64) NULL</text>
</g>
<g id="table_sql_test_dataset"><rect x="30" y="306" width="430" height="170" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="306" width="430" height="28" fill="#dceaf7"/><text x="38" y="325" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">sql_test_dataset</text>
<text x="38" y="354" font-family="Consolas,monospace" font-size="15" fill="#26384a">dataset_id: integer PK NOT NULL</text>
<text x="38" y="374" font-family="Consolas,monospace" font-size="15" fill="#26384a">question_id: integer FK NOT NULL</text>
<text x="38" y="394" font-family="Consolas,monospace" font-size="15" fill="#26384a">dataset_name: character varying(100) NOT NULL</text>
<text x="38" y="414" font-family="Consolas,monospace" font-size="15" fill="#26384a">setup_sql: text NOT NULL</text>
<text x="38" y="434" font-family="Consolas,monospace" font-size="15" fill="#26384a">expected_result: jsonb NOT NULL</text>
<text x="38" y="454" font-family="Consolas,monospace" font-size="15" fill="#26384a">is_edge_case: boolean NOT NULL</text>
</g>
<g id="table_system_setting"><rect x="490" y="306" width="430" height="130" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="306" width="430" height="28" fill="#dceaf7"/><text x="498" y="325" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">system_setting</text>
<text x="498" y="354" font-family="Consolas,monospace" font-size="15" fill="#26384a">setting_key: character varying(80) PK NOT NULL</text>
<text x="498" y="374" font-family="Consolas,monospace" font-size="15" fill="#26384a">value: jsonb NOT NULL</text>
<text x="498" y="394" font-family="Consolas,monospace" font-size="15" fill="#26384a">updated_by: integer FK NULL</text>
<text x="498" y="414" font-family="Consolas,monospace" font-size="15" fill="#26384a">updated_at: timestamp with time zone NOT NULL</text>
</g>
<g id="table_tab_leave_interval"><rect x="30" y="500" width="430" height="190" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="500" width="430" height="28" fill="#dceaf7"/><text x="38" y="519" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">tab_leave_interval</text>
<text x="38" y="548" font-family="Consolas,monospace" font-size="15" fill="#26384a">leave_event_id: uuid PK NOT NULL</text>
<text x="38" y="568" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="38" y="588" font-family="Consolas,monospace" font-size="15" fill="#26384a">left_at: timestamp with time zone NOT NULL</text>
<text x="38" y="608" font-family="Consolas,monospace" font-size="15" fill="#26384a">returned_at: timestamp with time zone NULL</text>
<text x="38" y="628" font-family="Consolas,monospace" font-size="15" fill="#26384a">return_event_id: uuid NULL</text>
<text x="38" y="648" font-family="Consolas,monospace" font-size="15" fill="#26384a">away_seconds: integer NULL</text>
<text x="38" y="668" font-family="Consolas,monospace" font-size="15" fill="#26384a">counted: boolean NOT NULL</text>
</g>
<g id="table_user_profile"><rect x="490" y="500" width="430" height="170" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="500" width="430" height="28" fill="#dceaf7"/><text x="498" y="519" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">user_profile</text>
<text x="498" y="548" font-family="Consolas,monospace" font-size="15" fill="#26384a">user_id: integer PK NOT NULL</text>
<text x="498" y="568" font-family="Consolas,monospace" font-size="15" fill="#26384a">account_id: integer FK NOT NULL</text>
<text x="498" y="588" font-family="Consolas,monospace" font-size="15" fill="#26384a">full_name: character varying(100) NOT NULL</text>
<text x="498" y="608" font-family="Consolas,monospace" font-size="15" fill="#26384a">student_code: character varying(20) NULL</text>
<text x="498" y="628" font-family="Consolas,monospace" font-size="15" fill="#26384a">phone_number: character varying(20) NULL</text>
<text x="498" y="648" font-family="Consolas,monospace" font-size="15" fill="#26384a">date_of_birth: date NULL</text>
</g>
</svg>
