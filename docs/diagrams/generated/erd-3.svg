<text x="38" y="988" font-family="Consolas,monospace" font-size="15" fill="#26384a">description: text NOT NULL</text>
<text x="38" y="1008" font-family="Consolas,monospace" font-size="15" fill="#26384a">scoring_guidance: text NOT NULL</text>
<text x="38" y="1028" font-family="Consolas,monospace" font-size="15" fill="#26384a">max_points: numeric NOT NULL</text>
<text x="38" y="1048" font-family="Consolas,monospace" font-size="15" fill="#26384a">sort_order: smallint NOT NULL</text>
<text x="38" y="1068" font-family="Consolas,monospace" font-size="15" fill="#26384a">profile_snapshot_hash: character(64) NOT NULL</text>
<text x="38" y="1088" font-family="Consolas,monospace" font-size="15" fill="#26384a">criterion_hash: character(64) NOT NULL</text>
</g>
<g id="table_clo_concept"><rect x="490" y="780" width="430" height="150" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="780" width="430" height="28" fill="#dceaf7"/><text x="498" y="799" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">clo_concept</text>
<text x="498" y="828" font-family="Consolas,monospace" font-size="15" fill="#26384a">clo_id: integer PK,FK NOT NULL</text>
<text x="498" y="848" font-family="Consolas,monospace" font-size="15" fill="#26384a">concept_id: integer PK,FK NOT NULL</text>
<text x="498" y="868" font-family="Consolas,monospace" font-size="15" fill="#26384a">mapping_source: character varying(10) NOT NULL</text>
<text x="498" y="888" font-family="Consolas,monospace" font-size="15" fill="#26384a">status: character varying(20) NOT NULL</text>
<text x="498" y="908" font-family="Consolas,monospace" font-size="15" fill="#26384a">created_at: timestamp with time zone NOT NULL</text>
