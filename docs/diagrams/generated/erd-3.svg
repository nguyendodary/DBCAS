<svg xmlns="http://www.w3.org/2000/svg" width="950" height="1164" viewBox="0 0 950 1164" role="img" aria-label="Entity Relationship Diagram — DBCAS (3/13)">
<title>Entity Relationship Diagram — DBCAS (3/13)</title><desc>41 bảng thật, thuộc tính PK/FK/kiểu/null; legacy/retired = assessment, assessment_blueprint, assessment_concept, assessment_question</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34495e"/></marker><marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa7b4"/></marker></defs>
<rect width="950" height="1164" fill="#ffffff"/>
<text x="24" y="34" font-family="Arial" font-size="26" font-weight="bold" fill="#10254f">Entity Relationship Diagram — DBCAS (3/13)</text>
<text x="30" y="64" font-family="Arial" font-size="13" fill="#5c6c7c">PK = primary key · FK = foreign key · NULL = nullable · legacy/retired tables are shaded amber.</text>
<g id="table_assessment_concept"><rect x="30" y="92" width="430" height="150" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="92" width="430" height="28" fill="#f6d99a"/><text x="38" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">assessment_concept [legacy/retired]</text>
<text x="38" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">assessment_id: integer PK,FK NOT NULL</text>
<text x="38" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">concept_id: integer PK,FK NOT NULL</text>
<text x="38" y="180" font-family="Consolas,monospace" font-size="15" fill="#26384a">min_difficulty: smallint NOT NULL</text>
<text x="38" y="200" font-family="Consolas,monospace" font-size="15" fill="#26384a">max_difficulty: smallint NOT NULL</text>
<text x="38" y="220" font-family="Consolas,monospace" font-size="15" fill="#26384a">target_pct: numeric NOT NULL</text>
</g>
<g id="table_assessment_question"><rect x="490" y="92" width="430" height="90" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="92" width="430" height="28" fill="#f6d99a"/><text x="498" y="111" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">assessment_question [legacy/retired]</text>
<text x="498" y="140" font-family="Consolas,monospace" font-size="15" fill="#26384a">assessment_id: integer PK,FK NOT NULL</text>
<text x="498" y="160" font-family="Consolas,monospace" font-size="15" fill="#26384a">question_id: integer PK,FK NOT NULL</text>
</g>
<g id="table_assessment_session"><rect x="30" y="266" width="430" height="490" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="266" width="430" height="28" fill="#dceaf7"/><text x="38" y="285" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">assessment_session</text>
<text x="38" y="314" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer PK,FK NOT NULL</text>
<text x="38" y="334" font-family="Consolas,monospace" font-size="15" fill="#26384a">assessment_id: integer FK NULL</text>
<text x="38" y="354" font-family="Consolas,monospace" font-size="15" fill="#26384a">learner_id: integer FK NOT NULL</text>
<text x="38" y="374" font-family="Consolas,monospace" font-size="15" fill="#26384a">status: character varying(20) NOT NULL</text>
<text x="38" y="394" font-family="Consolas,monospace" font-size="15" fill="#26384a">purpose: character varying(10) NOT NULL</text>
<text x="38" y="414" font-family="Consolas,monospace" font-size="15" fill="#26384a">purpose_source: character varying(10) NOT NULL</text>
<text x="38" y="434" font-family="Consolas,monospace" font-size="15" fill="#26384a">locale: character varying(16) NOT NULL</text>
<text x="38" y="454" font-family="Consolas,monospace" font-size="15" fill="#26384a">started_at: timestamp with time zone NOT NULL</text>
<text x="38" y="474" font-family="Consolas,monospace" font-size="15" fill="#26384a">expires_at: timestamp with time zone NOT NULL</text>
<text x="38" y="494" font-family="Consolas,monospace" font-size="15" fill="#26384a">submitted_at: timestamp with time zone NULL</text>
<text x="38" y="514" font-family="Consolas,monospace" font-size="15" fill="#26384a">config_snapshot: jsonb NULL</text>
<text x="38" y="534" font-family="Consolas,monospace" font-size="15" fill="#26384a">result_release_policy: character varying(20) NOT NULL</text>
<text x="38" y="554" font-family="Consolas,monospace" font-size="15" fill="#26384a">release_status: character varying(20) NOT NULL</text>
<text x="38" y="574" font-family="Consolas,monospace" font-size="15" fill="#26384a">start_request_id: character varying(36) NULL</text>
<text x="38" y="594" font-family="Consolas,monospace" font-size="15" fill="#26384a">review_revision: integer NOT NULL</text>
<text x="38" y="614" font-family="Consolas,monospace" font-size="15" fill="#26384a">published_at: timestamp with time zone NULL</text>
<text x="38" y="634" font-family="Consolas,monospace" font-size="15" fill="#26384a">blueprint_id: integer FK NULL</text>
<text x="38" y="654" font-family="Consolas,monospace" font-size="15" fill="#26384a">tab_leave_count: integer NOT NULL</text>
<text x="38" y="674" font-family="Consolas,monospace" font-size="15" fill="#26384a">cancelled_at: timestamp with time zone NULL</text>
<text x="38" y="694" font-family="Consolas,monospace" font-size="15" fill="#26384a">cancel_reason: character varying(40) NULL</text>
<text x="38" y="714" font-family="Consolas,monospace" font-size="15" fill="#26384a">review_policy: character varying(20) NOT NULL</text>
<text x="38" y="734" font-family="Consolas,monospace" font-size="15" fill="#26384a">current_result_version_id: bigint FK NULL</text>
</g>
<g id="table_attempt"><rect x="490" y="266" width="430" height="470" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="490" y="266" width="430" height="28" fill="#dceaf7"/><text x="498" y="285" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">attempt</text>
<text x="498" y="314" font-family="Consolas,monospace" font-size="15" fill="#26384a">attempt_id: integer PK NOT NULL</text>
<text x="498" y="334" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="498" y="354" font-family="Consolas,monospace" font-size="15" fill="#26384a">question_id: integer FK NOT NULL</text>
<text x="498" y="374" font-family="Consolas,monospace" font-size="15" fill="#26384a">seq_no: smallint NOT NULL</text>
<text x="498" y="394" font-family="Consolas,monospace" font-size="15" fill="#26384a">selected_option_id: integer FK NULL</text>
<text x="498" y="414" font-family="Consolas,monospace" font-size="15" fill="#26384a">sql_answer: text NULL</text>
<text x="498" y="434" font-family="Consolas,monospace" font-size="15" fill="#26384a">essay_answer: text NULL</text>
<text x="498" y="454" font-family="Consolas,monospace" font-size="15" fill="#26384a">score: numeric NULL</text>
<text x="498" y="474" font-family="Consolas,monospace" font-size="15" fill="#26384a">grading_detail: jsonb NULL</text>
<text x="498" y="494" font-family="Consolas,monospace" font-size="15" fill="#26384a">served_at: timestamp with time zone NOT NULL</text>
<text x="498" y="514" font-family="Consolas,monospace" font-size="15" fill="#26384a">submitted_at: timestamp with time zone NULL</text>
<text x="498" y="534" font-family="Consolas,monospace" font-size="15" fill="#26384a">is_flagged: boolean NOT NULL</text>
<text x="498" y="554" font-family="Consolas,monospace" font-size="15" fill="#26384a">flag_revision: integer NOT NULL</text>
<text x="498" y="574" font-family="Consolas,monospace" font-size="15" fill="#26384a">first_opened_at: timestamp with time zone NULL</text>
<text x="498" y="594" font-family="Consolas,monospace" font-size="15" fill="#26384a">question_snapshot: jsonb NULL</text>
<text x="498" y="614" font-family="Consolas,monospace" font-size="15" fill="#26384a">draft_answer: jsonb NULL</text>
<text x="498" y="634" font-family="Consolas,monospace" font-size="15" fill="#26384a">draft_revision: integer NOT NULL</text>
<text x="498" y="654" font-family="Consolas,monospace" font-size="15" fill="#26384a">draft_saved_at: timestamp with time zone NULL</text>
<text x="498" y="674" font-family="Consolas,monospace" font-size="15" fill="#26384a">submission_hash: character varying(64) NULL</text>
<text x="498" y="694" font-family="Consolas,monospace" font-size="15" fill="#26384a">grading_status: character varying(20) NOT NULL</text>
<text x="498" y="714" font-family="Consolas,monospace" font-size="15" fill="#26384a">review_revision: integer NOT NULL</text>
</g>
<g id="table_attempt_rubric_criterion"><rect x="30" y="780" width="430" height="330" fill="#ffffff" stroke="#34495e" stroke-width="1.4"/><rect x="30" y="780" width="430" height="28" fill="#dceaf7"/><text x="38" y="799" font-family="Arial" font-size="14" font-weight="bold" fill="#10254f">attempt_rubric_criterion</text>
<text x="38" y="828" font-family="Consolas,monospace" font-size="15" fill="#26384a">criterion_snapshot_id: bigint PK NOT NULL</text>
<text x="38" y="848" font-family="Consolas,monospace" font-size="15" fill="#26384a">session_id: integer FK NOT NULL</text>
<text x="38" y="868" font-family="Consolas,monospace" font-size="15" fill="#26384a">attempt_id: integer FK NOT NULL</text>
<text x="38" y="888" font-family="Consolas,monospace" font-size="15" fill="#26384a">question_id: integer FK NOT NULL</text>
<text x="38" y="908" font-family="Consolas,monospace" font-size="15" fill="#26384a">rubric_profile_id: bigint FK NOT NULL</text>
<text x="38" y="928" font-family="Consolas,monospace" font-size="15" fill="#26384a">criterion_id: bigint FK NOT NULL</text>
