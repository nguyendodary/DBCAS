<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-label="Pipeline"><rect width="1500" height="900" fill="#FFFFFF"/><g font-family="Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><text x="750.0" y="55" font-size="26" text-anchor="middle" fill="#000000" font-weight="bold">Evidence-based adaptive assessment pipeline</text><text x="750.0" y="80" font-size="13" text-anchor="middle" fill="#000000" font-style="italic">Three basic MCQs first · each later question selected from live evidence</text><rect x="40" y="140" width="220" height="120" rx="10" fill="#F8F9FA" stroke="#000000" stroke-width="1.5"/><text x="150" y="185" font-size="15" text-anchor="middle" fill="#000000" font-weight="bold">Opening</text><text x="150" y="210" font-size="11" text-anchor="middle" fill="#000000">3 MCQs at levels 1–2</text><text x="150" y="226" font-size="11" text-anchor="middle" fill="#000000">from validated bank</text><rect x="280" y="140" width="220" height="120" rx="10" fill="#F8F9FA" stroke="#000000" stroke-width="1.5"/><text x="390" y="185" font-size="15" text-anchor="middle" fill="#000000" font-weight="bold">Grade each answer</text><text x="390" y="210" font-size="11" text-anchor="middle" fill="#000000">MCQ key · SQL sandbox</text><text x="390" y="226" font-size="11" text-anchor="middle" fill="#000000">LLM-assisted essay</text><rect x="520" y="140" width="220" height="120" rx="10" fill="#F8F9FA" stroke="#000000" stroke-width="1.5"/><text x="630" y="185" font-size="15" text-anchor="middle" fill="#000000" font-weight="bold">Evidence</text><text x="630" y="210" font-size="11" text-anchor="middle" fill="#000000">Record result</text><text x="630" y="226" font-size="11" text-anchor="middle" fill="#000000">update concept estimates</text><rect x="760" y="140" width="220" height="120" rx="10" fill="#F8F9FA" stroke="#000000" stroke-width="1.5"/><text x="870" y="185" font-size="15" text-anchor="middle" fill="#000000" font-weight="bold">Adaptive selection</text><text x="870" y="210" font-size="11" text-anchor="middle" fill="#000000">After opening MCQs:</text><text x="870" y="226" font-size="11" text-anchor="middle" fill="#000000">3/3 harder · 2/3 medium</text><rect x="1000" y="140" width="220" height="120" rx="10" fill="#F8F9FA" stroke="#000000" stroke-width="1.5"/><text x="1110" y="185" font-size="15" text-anchor="middle" fill="#000000" font-weight="bold">Next item</text><text x="1110" y="210" font-size="11" text-anchor="middle" fill="#000000">Serve validated</text><text x="1110" y="226" font-size="11" text-anchor="middle" fill="#000000">question only</text><rect x="40" y="520" width="220" height="120" rx="10" fill="#F8F9FA" stroke="#000000" stroke-width="1.5"/><text x="150" y="565" font-size="15" text-anchor="middle" fill="#000000" font-weight="bold">Candidate preparation</text><text x="150" y="590" font-size="11" text-anchor="middle" fill="#000000">AI drafts before sessions</text><text x="150" y="606" font-size="11" text-anchor="middle" fill="#000000">System checks candidate</text><rect x="420" y="520" width="220" height="120" rx="10" fill="#F8F9FA" stroke="#000000" stroke-width="1.5"/><text x="530" y="565" font-size="15" text-anchor="middle" fill="#000000" font-weight="bold">Validated item bank</text><text x="530" y="590" font-size="11" text-anchor="middle" fill="#000000">Store only after approval</text><text x="530" y="606" font-size="11" text-anchor="middle" fill="#000000">Only validated items served</text><rect x="900" y="520" width="220" height="120" rx="10" fill="#F8F9FA" stroke="#000000" stroke-width="1.5"/><text x="1010" y="565" font-size="15" text-anchor="middle" fill="#000000" font-weight="bold">Complete assessment</text><text x="1010" y="590" font-size="11" text-anchor="middle" fill="#000000">At configured cap or 00:00</text><text x="1010" y="606" font-size="11" text-anchor="middle" fill="#000000">Deterministic per-concept profile</text><path d="M260,200 H280" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><path d="M500,200 H520" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><path d="M740,200 H760" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><path d="M980,200 H1000" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><path d="M1110,200 H1010" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><path d="M1000,260 V520" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><path d="M400,580 H420" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><text x="750.0" y="820" font-size="15" text-anchor="middle" fill="#000000" font-weight="bold">Target mix for a full session: 10 MCQ / 2 SQL / 1 essay</text><text x="750.0" y="845" font-size="11" text-anchor="middle" fill="#000000" font-style="italic">Ranked gap topics only; long-term learning paths and course-document retrieval are outside scope.</text></g></svg>