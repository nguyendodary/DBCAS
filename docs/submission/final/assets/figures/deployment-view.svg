<text x="900" y="1320" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#52657A" text-anchor="start">Network boundaries: web (frontend, app, mailpit) and database (internal, app and db only). The sandbox is not a Compose service.</text>
<text x="900" y="1360" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#52657A" text-anchor="start">Sources: docker-compose.local.yml, docker-compose.qa.yml, docker-compose.real-qa.yml, backend/app/services/ephemeral_sandbox.py</text>
<text x="900" y="1400" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#52657A" text-anchor="start">QA-only services are never started by the default profile; they exist so browser tests never call a real model.</text>
