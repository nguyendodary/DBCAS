<text x="350.0" y="768" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#EAF4FB" text-anchor="middle">18080 → 8080</text>
<text x="350.0" y="798" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#EAF4FB" text-anchor="middle">proxies /api/v1</text>
