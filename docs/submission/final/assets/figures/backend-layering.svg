<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img"><rect width="1000" height="460" fill="#FFFFFF"/><text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#083F75">Backend layering and dependency direction</text><text x="24" y="64" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#52657A">HTTP contract → use case and transaction → query and lock → PostgreSQL. Dependencies point one way; the arrow is enforced in review.</text><rect x="40" y="130" width="190" height="150" rx="10" fill="#EAF4FB" stroke="#083F75" stroke-width="2.5"/><text x="135.0" y="176" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#083F75" text-anchor="middle">Router</text><text x="135.0" y="212" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2937" text-anchor="middle">path, status code,</text><text x="135.0" y="236" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2937" text-anchor="middle">request/response</text><text x="135.0" y="260" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2937" text-anchor="middle">schema, dependency</text><rect x="300" y="130" width="190" height="150" rx="10" fill="#D6EAF8" stroke="#083F75" stroke-width="2.5"/><text x="395.0" y="176" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#083F75" text-anchor="middle">Service</text><text x="395.0" y="212" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2937" text-anchor="middle">use case, transaction</text><text x="395.0" y="236" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2937" text-anchor="middle">boundary, error code</text><rect x="560" y="130" width="190" height="150" rx="10" fill="#EAF4FB" stroke="#083F75" stroke-width="2.5"/><text x="655.0" y="176" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#083F75" text-anchor="middle">Repository</text><text x="655.0" y="212" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2937" text-anchor="middle">query, lock,</text><text x="655.0" y="236" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2937" text-anchor="middle">pagination</text><rect x="820" y="130" width="150" height="150" rx="10" fill="#D6EAF8" stroke="#083F75" stroke-width="2.5"/><text x="895.0" y="176" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#083F75" text-anchor="middle">PostgreSQL 17</text><text x="895.0" y="212" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2937" text-anchor="middle">SQLAlchemy / psycopg</text><line x1="230" y1="205" x2="292" y2="205" stroke="#C55A11" stroke-width="3" marker-end="url(#arrow)"/><line x1="490" y1="205" x2="552" y2="205" stroke="#C55A11" stroke-width="3" marker-end="url(#arrow)"/><line x1="750" y1="205" x2="812" y2="205" stroke="#C55A11" stroke-width="3" marker-end="url(#arrow)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C55A11"/></marker></defs><rect x="300" y="320" width="450" height="72" rx="8" fill="#F2F2F2" stroke="#4472C4" stroke-width="1.2"/><text x="316" y="348" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#083F75">Model / schema</text><text x="316" y="374" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2937">table mapping, validation and serialisation; no business rules</text><rect x="40" y="320" width="220" height="72" rx="8" fill="#F2F2F2" stroke="#4472C4" stroke-width="1.2"/><text x="56" y="348" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#083F75">Security / config</text><text x="56" y="374" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2937">JWT, roles, settings</text><text x="24" y="432" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#52657A">Measured exception: six router handlers still query the session directly; they are listed as known debt in §4, not as an accepted pattern.</text></svg>