name: Demo seed benchmark

# Manual, non-gating measurement for the synthetic demo seed snapshot.
on:
  workflow_dispatch:
  push:
    branches: [fix/demo-seed-snapshot]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DBCAS_LOCAL_PROJECT: dbcas-demo-bench-${{ github.run_id }}
      LOCAL_API_PORT: '18900'
      LOCAL_WEB_PORT: '18980'
      LOCAL_MAIL_PORT: '18925'
      LOCAL_SMTP_PORT: '11925'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare environment and images
        run: |
          cp .env.example .env
          password=$(python3 -c 'import secrets; print(secrets.token_hex(24))')
          jwt=$(python3 -c 'import secrets; print(secrets.token_hex(48))')
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$password|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$jwt|" .env
          docker pull postgres:17
          docker compose -p "$DBCAS_LOCAL_PROJECT" -f docker-compose.local.yml build
          docker compose -p "$DBCAS_LOCAL_PROJECT" -f docker-compose.local.yml down -v --remove-orphans
      - name: Measure full seed and snapshot restore (N=5)
        shell: bash
        run: |
          set -euo pipefail
          run_once() {
            local label="$1" start end
            docker compose -p "$DBCAS_LOCAL_PROJECT" -f docker-compose.local.yml down -v --remove-orphans >/dev/null 2>&1 || true
            start=$(date +%s)
            if ! npm start >"/tmp/start-$label.log" 2>&1; then
              echo "npm start failed for $label"
              cat "/tmp/start-$label.log"
              docker compose -p "$DBCAS_LOCAL_PROJECT" -f docker-compose.local.yml ps || true
              curl -sS -i "http://127.0.0.1:${LOCAL_API_PORT}/readiness" || true
              docker compose -p "$DBCAS_LOCAL_PROJECT" -f docker-compose.local.yml exec -T app id || true
              docker compose -p "$DBCAS_LOCAL_PROJECT" -f docker-compose.local.yml exec -T app docker image inspect dbcas-sql-ephemeral:local --format '{{json .Config.Labels}}' || true
              docker compose -p "$DBCAS_LOCAL_PROJECT" -f docker-compose.local.yml logs --no-color --tail=300 db init app || true
              return 1
            fi
            end=$(date +%s)
            npm run stop >/dev/null 2>&1 || true
            echo "$((end-start))"
          }
          full=()
          for i in 1 2 3 4 5; do
            set +e
            run_once full-$i >"/tmp/measure-full-$i.log" 2>&1
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              cat "/tmp/measure-full-$i.log"
              exit 1
            fi
            full+=("$(tail -n1 "/tmp/measure-full-$i.log")")
          done
          # The fifth full run left a seeded database; snapshot it now.
          docker compose -p "$DBCAS_LOCAL_PROJECT" -f docker-compose.local.yml up -d --wait --wait-timeout 600
          npm run demo:snapshot
          cached=()
          for i in 1 2 3 4 5; do
            set +e
            run_once snapshot-$i >"/tmp/measure-snapshot-$i.log" 2>&1
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              cat "/tmp/measure-snapshot-$i.log"
              exit 1
            fi
            cached+=("$(tail -n1 "/tmp/measure-snapshot-$i.log")")
          done
          python3 - "$(IFS=,; echo "${full[*]}")" "$(IFS=,; echo "${cached[*]}")" <<'PY'
          import json, statistics, sys
          full = [int(x) for x in sys.argv[1].split(',')]
          cached = [int(x) for x in sys.argv[2].split(',')]
          print(json.dumps({
              "n": 5,
              "full_seconds": full,
              "snapshot_seconds": cached,
              "full_median": statistics.median(full),
              "snapshot_median": statistics.median(cached),
          }, indent=2))
          PY
      - name: Cleanup
        if: always()
        run: docker compose -p "$DBCAS_LOCAL_PROJECT" -f docker-compose.local.yml down -v --remove-orphans || true
