name: Frontend tests

on:
  push:
    branches:
      - frontend

permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --reporter=dot src/test/LearnerPages.test.jsx src/test/BackgroundVideo.test.jsx
      - run: npm run build
