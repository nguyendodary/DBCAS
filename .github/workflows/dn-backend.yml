name: Local quality gate
# Required checks on main: secrets, backend, frontend-local.
# frontend-local is a fan-in aggregator over frontend-static and every frontend-shard leg.
on:
  push:
    branches: [develop2, main]
  pull_request:
    branches: [develop2, main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin "$base" "$head" || true
          changed=$(git diff --name-only "$base" "$head")
          if [ -z "$changed" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          while IFS= read -r f; do
            case "$f" in
              docs/qa/*) docs_only=false; break ;;
              docs/*|standards/*) ;;
              *) docs_only=false; break ;;
            esac
          done <<< "$changed"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  secrets:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: needs.changes.outputs.docs_only != 'true'
        run: python -m unittest discover -s scripts/tests -p test_secret_scan.py
      - if: needs.changes.outputs.docs_only != 'true'
        run: python scripts/scan_secrets.py
      - if: needs.changes.outputs.docs_only == 'true'
        run: echo "docs-only PR; secret scan skipped"

  backend:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEPLOYMENT_MODE: development
      LLM_API_KEY: ''
      LLM_BASE_URL: ''
      LLM_MODEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - if: needs.changes.outputs.docs_only != 'true'
        run: python -m pip install --upgrade pip==26.3
      - if: needs.changes.outputs.docs_only != 'true'
        run: python -m pip install -r backend/requirements-dev.txt
      - if: needs.changes.outputs.docs_only != 'true'
        name: Audit installed Python dependencies
        run: |
          python -m venv /tmp/dbcas-dependency-audit
          /tmp/dbcas-dependency-audit/bin/python -m pip install pip==26.3 pip-audit==2.10.1
          /tmp/dbcas-dependency-audit/bin/python -m pip_audit --path "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
      - if: needs.changes.outputs.docs_only != 'true'
        run: python backend/manage.py lint
      - if: needs.changes.outputs.docs_only != 'true'
        run: python backend/manage.py build
      - if: needs.changes.outputs.docs_only != 'true'
        run: python scripts/test_live_ai_budget.py
      - if: needs.changes.outputs.docs_only != 'true'
        run: python -m pip check
      - if: needs.changes.outputs.docs_only != 'true'
        run: python scripts/export_openapi.py --check
      - if: needs.changes.outputs.docs_only != 'true'
        run: python backend/manage.py validate-bank
      - if: needs.changes.outputs.docs_only != 'true'
        run: python backend/manage.py test
      - if: needs.changes.outputs.docs_only != 'true'
        run: cp .env.example .env
      - if: needs.changes.outputs.docs_only != 'true'
        run: docker compose -f docker-compose.dn.yml config -q
      - if: needs.changes.outputs.docs_only != 'true'
        uses: docker/setup-buildx-action@v3
      - if: needs.changes.outputs.docs_only != 'true'
        name: Build backend CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: dbcas-dn-ci:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: needs.changes.outputs.docs_only == 'true'
        run: echo "docs-only PR; backend checks skipped"

  frontend-static:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_API_KEY: ''
      LLM_BASE_URL: ''
      LLM_MODEL: ''
      DBCAS_TEST_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - run: python -m pip install --upgrade pip==26.3
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm --prefix frontend ci
      - name: Verify every e2e spec is assigned to exactly one shard
        run: bash scripts/e2e-shards.sh check
      - run: node --test scripts/browser_config.test.mjs
      - run: node --test scripts/provider_control.test.mjs
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend test -- --maxWorkers=2
      - run: npm --prefix frontend run build
      - name: Frontend security audit regression tests
        run: node --test scripts/frontend_security_audit.test.mjs
      - name: Frontend security audit (GHSA-fc5q-39xc-vjpf exception until 2026-12-18)
        run: node scripts/frontend_security_audit.mjs
      - run: npm audit --audit-level=high
      - run: npm run test:local
      - run: npm run inventory:check
      - run: npm ci
      - run: npm run diagrams:render
      - run: npm run docs:check

  frontend-shard:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: e2e-1
            kind: e2e
            shard_arg: ''
            mode: localization
            project: dbcas-e2e-1
            api_port: 18100
            web_port: 18180
            mail_port: 18125
            smtp_port: 11125
            qa_port: 18199
            qa_load: '0'
          - name: e2e-2
            kind: e2e
            shard_arg: '--shard=1/2'
            mode: rest
            project: dbcas-e2e-2
            api_port: 18101
            web_port: 18181
            mail_port: 18126
            smtp_port: 11126
            qa_port: 18209
            qa_load: '0'
          - name: e2e-3
            kind: e2e
            shard_arg: '--shard=2/2'
            mode: rest
            project: dbcas-e2e-3
            api_port: 18102
            web_port: 18182
            mail_port: 18127
            smtp_port: 11127
            qa_port: 18219
            qa_load: '0'
          - name: qa-1
            kind: qa
            shard: ''
            project: dbcas-qa-1
            api_port: 18200
            web_port: 18280
            mail_port: 18225
            smtp_port: 11225
            qa_port: 18299
            qa_load: '1'
          - name: qa-2
            kind: qa
            shard: ''
            project: dbcas-qa-2
            api_port: 18300
            web_port: 18380
            mail_port: 18325
            smtp_port: 11325
            qa_port: 18399
            qa_load: '0'
          - name: qa-3
            kind: qa
            shard: ''
            project: dbcas-qa-3
            api_port: 18400
            web_port: 18480
            mail_port: 18425
            smtp_port: 11425
            qa_port: 18499
            qa_load: '0'
          - name: smoke-1
            kind: smoke
            shard: ''
            project: dbcas-smoke-1
            api_port: 18500
            web_port: 18580
            mail_port: 18525
            smtp_port: 11525
            qa_port: 18599
            qa_load: '0'
          - name: smoke-2
            kind: smoke
            shard: ''
            project: dbcas-smoke-2
            api_port: 18600
            web_port: 18680
            mail_port: 18625
            smtp_port: 11625
            qa_port: 18699
            qa_load: '0'
          - name: smoke-3
            kind: smoke
            shard: ''
            project: dbcas-smoke-3
            api_port: 18700
            web_port: 18780
            mail_port: 18725
            smtp_port: 11725
            qa_port: 18799
            qa_load: '0'
    env:
      LLM_API_KEY: ''
      LLM_BASE_URL: ''
      LLM_MODEL: ''
      DBCAS_TEST_PYTHON: python
      DBCAS_LOCAL_PROJECT: ${{ matrix.project }}
      LOCAL_API_PORT: ${{ matrix.api_port }}
      LOCAL_WEB_PORT: ${{ matrix.web_port }}
      LOCAL_MAIL_PORT: ${{ matrix.mail_port }}
      LOCAL_SMTP_PORT: ${{ matrix.smtp_port }}
      LOCAL_QA_PROVIDER_PORT: ${{ matrix.qa_port }}
      DBCAS_TEST_SMTP_PORT: ${{ matrix.smtp_port }}
      DBCAS_MAILPIT_API: http://127.0.0.1:${{ matrix.mail_port }}
      DBCAS_LOCAL_URL: http://127.0.0.1:${{ matrix.web_port }}
      DBCAS_QA_PROVIDER_URL: http://127.0.0.1:${{ matrix.qa_port }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - run: python -m pip install --upgrade pip==26.3
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm --prefix frontend ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install chromium
        working-directory: frontend
      - name: Start Mailpit for e2e
        if: matrix.kind == 'e2e'
        run: |
          cp .env.example .env
          docker compose -p "$DBCAS_LOCAL_PROJECT" -f docker-compose.local.yml up -d --wait mailpit
      - name: Run e2e shard
        if: matrix.kind == 'e2e'
        shell: bash
        run: |
          cd frontend
          # Single source of truth for spec assignment; QA/smoke/manual specs
          # are derived from their Playwright configs, so a spec added to one
          # of those configs is never also run by an e2e shard.
          files=$(bash ../scripts/e2e-shards.sh ${{ matrix.mode }})
          echo "e2e files: $files"
          npm run test:e2e -- $files ${{ matrix.shard_arg }}
      - name: Start local stack for smoke
        if: matrix.kind == 'smoke'
        run: npm start
      - name: Run smoke shard
        if: matrix.kind == 'smoke'
        working-directory: frontend
        run: npx playwright test --config playwright.local.config.js --repeat-each=1
      - name: Run QA shard
        if: matrix.kind == 'qa'
        env:
          DBCAS_QA_LOAD: ${{ matrix.qa_load }}
          DBCAS_QA_PLAYWRIGHT_ARGS: '--grep-invert=0/1/3'
        run: node scripts/browser-qa.mjs 1
      - name: Upload QA docker events
        if: always() && matrix.kind == 'qa'
        uses: actions/upload-artifact@v4
        with:
          name: qa-docker-events-${{ matrix.name }}
          path: _review/qa-docker-events.log
          if-no-files-found: warn
      - name: Cleanup compose project
        if: always() && (matrix.kind == 'e2e' || matrix.kind == 'smoke' || matrix.kind == 'qa')
        run: docker compose -p "$DBCAS_LOCAL_PROJECT" -f docker-compose.local.yml -f docker-compose.qa.yml down --volumes --remove-orphans || true
      - name: Record shard result
        if: always()
        run: |
          mkdir -p shard-result
          echo "${{ matrix.name }} ${{ job.status }}" > "shard-result/${{ matrix.name }}.txt"
      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.name }}
          path: shard-result/${{ matrix.name }}.txt
          if-no-files-found: error

  frontend-local:
    if: always()
    needs: [changes, frontend-static, frontend-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify frontend jobs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.changes.outputs.docs_only }}" = "true" ]; then
            echo "docs-only PR: frontend jobs intentionally skipped"
            exit 0
          fi
          test "${{ needs.frontend-static.result }}" = "success" || { echo "frontend-static: ${{ needs.frontend-static.result }}"; exit 1; }
          test "${{ needs.frontend-shard.result }}" = "success" || { echo "frontend-shard: ${{ needs.frontend-shard.result }}"; exit 1; }
      - name: Download shard results
        if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true
      - name: Verify every shard reported success
        if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          expected=9
          actual=$(find shards -type f -name '*.txt' | wc -l)
          echo "shard_artifacts=$actual expected=$expected"
          test "$actual" -eq "$expected"
          if grep -R -v ' success$' shards; then
            echo "A shard did not report success"
            exit 1
          fi
