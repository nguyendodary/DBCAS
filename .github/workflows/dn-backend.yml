name: Local quality gate
on:
  push:
    branches: [develop2]
  pull_request:
    branches: [develop2]
permissions:
  contents: read
concurrency:
  group: local-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOYMENT_MODE: development
      LLM_API_KEY: ''
      LLM_BASE_URL: ''
      LLM_MODEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python backend/manage.py lint
      - run: python backend/manage.py build
      - run: python -m pip check
      - run: python scripts/export_openapi.py --check
      - run: python backend/manage.py test
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.dn.yml config -q
      - run: docker build -f backend/Dockerfile -t dbcas-dn-ci .
  frontend-local:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_API_KEY: ''
      LLM_BASE_URL: ''
      LLM_MODEL: ''
      DBCAS_TEST_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test -- --maxWorkers=2
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend audit --audit-level=high
      - run: npm run test:local
      - run: npm run inventory:check
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: test ! -f .env && npm start
      - run: npm --prefix frontend run test:e2e
      - run: npm run test:smoke
      - run: npm run test:qa
      - if: always()
        run: |
          if [ -f .env ]; then
            docker compose -p dbcas-local -f docker-compose.local.yml down --volumes
          fi
