# Local test harness only; npm start never includes this override.
services:
  qa-ai:
    image: dbcas-local-api:local
    command: [python, /qa/provider.py]
    environment: {PYTHONPATH: /srv/DBCAS/backend}
    volumes: ['./backend/tests/qa_provider.py:/qa/provider.py:ro']
    ports: ['127.0.0.1:${LOCAL_QA_PROVIDER_PORT:-18099}:8080']
    networks: [web]
    # Sampled curves (qa-memory artifact) are step-like, not linear: ~18MiB at
    # start, ~59MiB after the first evaluation import, then ~119-134MiB RSS
    # after the practice-service import, flat for the rest of the suite.
    # Measured cgroup peak is 144.1MiB; 2x = 288.2MiB, rounded up to 320m so
    # the verification bound (peak < 50% of limit = 160MiB) has margin.
    # The limit stays in place and there is no restart policy.
    mem_limit: 320m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    environment:
      LLM_PROVIDER: openai_compatible
      LLM_API_KEY: qa-only-not-a-real-key
      LLM_BASE_URL: http://qa-ai:8080/v1
      LLM_MODEL: deterministic-local-qa
      LLM_TIMEOUT_SECONDS: '120'
      LLM_MAX_RETRIES: '0'
      GRADING_JOB_MAX_ATTEMPTS: '1'
      SESSION_SWEEP_SECONDS: '1'
      ACCESS_TOKEN_EXPIRE_MINUTES: '1'
    depends_on:
      qa-ai: {condition: service_healthy}
